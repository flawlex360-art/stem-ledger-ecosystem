<title>Kpando STEM Community</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap');

  *{ box-sizing: border-box; }

:root {
  --bg: #F7F8FA;
  --surface: #FFFFFF;
  --surface-card: #FFFFFF;
  --surface-2: #F1F3F5;
  --surface-subtle: #F1F3F5;
  --surface-hover: #ECEEF1;
  --ink: #111827;
  --ink-soft: #4B5563;
  --ink-muted: #9CA3AF;
  --border: #E5E7EB;
  --border-subtle: #F3F4F6;
  --primary: #0D7C66;
  --primary-600: #10B981;
  --primary-soft: rgba(16,185,129,0.07);
  --primary-glow: rgba(16,185,129,0.15);
  --accent: #0D7C66;
  --accent-600: #10B981;
  --accent-soft: rgba(16,185,129,0.07);
  --success: #059669;
  --success-soft: rgba(5,150,105,0.08);
  --success-border: rgba(5,150,105,0.15);
  --warning: #D97706;
  --warning-soft: rgba(217,119,6,0.08);
  --warning-border: rgba(217,119,6,0.15);
  --danger: #DC2626;
  --danger-soft: rgba(220,38,38,0.06);
  --danger-border: rgba(220,38,38,0.12);
  --science: #2D6A4F;
  --it: #0891B2;
  --math: #C2410C;
  --engineering: #7C3AED;
  --radius: 12px;
  --radius-xl: 20px;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --radius-full: 9999px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
  --shadow-md: 0 4px 12px -1px rgba(0,0,0,0.06), 0 2px 4px -1px rgba(0,0,0,0.03);
  --shadow-card: 0 4px 12px -1px rgba(0,0,0,0.06), 0 2px 4px -1px rgba(0,0,0,0.03);
  --shadow-hover: 0 10px 25px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.03);
  --shadow-lg: 0 10px 25px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.03);
  --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}

body {
  font-family: var(--font-body);
  background-color: var(--bg);

  background-repeat: repeat;
  background-size: 400px 400px;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

  body.convo-open { overflow: hidden !important; height: 100vh !important; }

  /* ---------- Layout ---------- */
  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:268px; flex-shrink:0; background:var(--surface);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; gap:28px;
    padding:24px 20px; position:sticky; top:0; height:100vh; overflow-y:auto; z-index:40;
  }
  .main{ flex:1; padding:28px 36px 60px; min-width:0; }

  /* ---------- Brand ---------- */
  .brand{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  .brand-title{ font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:-0.01em; }
  .brand-sub{ font-size:12px; color:var(--ink-soft); }

  /* ---------- Nav ---------- */
  .nav{ display:flex; flex-direction:column; gap:4px; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:var(--radius-sm);
    border:none; background:transparent; cursor:pointer;
    font-family:var(--font-body); font-size:14px; font-weight:500;
    color:var(--ink-soft); text-align:left; width:100%;
  }
  .nav-item:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-item.active{ background:var(--primary-soft); color:var(--primary); font-weight:600; }

  /* ---------- Buttons ---------- */
  .btn { font-family:var(--font-body); font-size:13px; font-weight:600; padding:10px 16px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:background .15s ease, border-color .15s ease, color .15s ease; }
  .btn:hover{ background:var(--surface-2); }
  .btn-primary {
  background: var(--primary-600); border-color: var(--primary-600); color: #fff;
  box-shadow: 0 1px 3px rgba(13,124,102,0.3);
}
  .btn-primary:hover{ background:#16244C; }
  .btn-ghost{ border-color:transparent; background:transparent; color:var(--ink-soft); justify-content:flex-start; width:100%; font-weight:500; }
  .btn-ghost:hover{ background:var(--surface-2); color:var(--ink); }

  /* ---------- Topbar ---------- */
  .topbar{ display:flex; gap:14px; align-items:center; margin-bottom:24px; flex-wrap:wrap; }
  .menu-toggle{ display:none; border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); padding:8px 11px; cursor:pointer; font-size:15px; }

  /* ---------- Page header ---------- */
  .page-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; gap:24px; flex-wrap:wrap; }
  .page-title{ font-family:var(--font-display); font-size:26px; font-weight:700; margin:0 0 4px; letter-spacing:-0.01em; }
  .page-subtitle{ color:var(--ink-soft); font-size:14px; margin:0; }

  /* ---------- Stat cards ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(100px, 1fr)); gap:14px; margin-bottom:28px; }
  .stat-card { display:flex; flex-direction:column; justify-content:space-between; height:100%; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--primary); border-radius:var(--radius); padding:14px 10px; box-shadow:var(--shadow); transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); z-index: 2; position: relative; }
  .stat-card .stat-label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:8px; font-weight:600; }
  .stat-card .stat-value{ font-family:var(--font-display); font-size:24px; font-weight:700; }
  .stat-card .stat-meta{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

  /* ---------- Cards / Panels ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); transition: transform 0.2s; }
  .badge{ display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap; }

  /* ---------- Auth View Styling ---------- */
  .auth-container{ max-width:440px; margin:60px auto; padding:32px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .auth-title{ font-family:var(--font-display); font-size:22px; font-weight:700; text-align:center; margin-bottom:8px; color:var(--primary); }
  .auth-subtitle{ text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:28px; }
  .auth-form{ display:flex; flex-direction:column; gap:16px; }
  .form-group{ display:flex; flex-direction:column; gap:6px; }
  .form-group label{ font-size:12px; font-weight:600; color:var(--ink-soft); }
  .form-group input{ padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; background:var(--bg); color:var(--ink); font-family:inherit; }
  .form-group input:focus{ outline:2px solid var(--primary); }

  /* ---------- Tabs Transitions ---------- */
  .page-fade-in {
    animation: premiumEntrance 0.5s ease forwards;
    will-change: transform, opacity;
  }
  @keyframes premiumEntrance {
    0% {
      opacity: 0;
      transform: translateY(16px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ---------- Dialog / Overlay / Sheet ---------- */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.35); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:center; padding:20px; z-index: 500; }
  .modal-overlay[hidden]{ display:none; }
  .modal { background:var(--surface); border-radius:20px; width:100%; max-width:540px; max-height:90vh; overflow-y:auto; box-shadow:0 24px 60px rgba(0,0,0,0.22); animation: modalEnter 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
  @keyframes modalEnter { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .modal-header{ display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); }
  .modal-header h3{ margin:0; font-family:var(--font-display); font-size:18px; }
  .modal-
  .modal-footer{ padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }
  .close-btn{ border:none; background:transparent; font-size:22px; cursor:pointer; color:var(--ink-soft); line-height:1; padding:2px 6px; border-radius:var(--radius-sm); }
  .close-btn:hover{ background:var(--surface-2); }

  /* ---------- Toast notification ---------- */
  .toast-notification {
  position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
  background: var(--surface); color: var(--ink);
  padding: 12px 20px; border-radius: var(--radius-md);
  box-shadow: var(--shadow-hover); border: 1px solid var(--border);
  font-size: 13px; font-weight: 600; z-index: 10000;
  opacity: 0; pointer-events: none;
  transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  display: flex; gap: 10px; align-items: center; min-width: 250px; max-width: 90vw;
}
  .toast-notification.show { top: 20px; opacity: 1; pointer-events: auto; }
  .modal-overlay, .sidebar-wrapper, .bottom-nav-bar, .sheet-overlay, .overlay-sheet {
    transform: translate3d(0,0,0);
    backface-visibility: hidden;
    perspective: 1000px;
    will-change: transform, opacity;
  }
  .toast-notification {
    backface-visibility: hidden;
    perspective: 1000px;
    will-change: transform, opacity;
  }
  /* ---------- Splash screen ---------- */

  .splash-card {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: calc(100% - 40px); max-width: 320px;
    padding: 32px 24px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    text-align: center;
  }
  .splash-title { font-size: 28px; font-weight: 700; margin-bottom: 15px; font-family: var(--font-display); color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
  .splash-progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .splash-progress-fill { width: 0%; height: 100%; background: #ffffff; transition: width 0.1s linear; }
  .splash-footer { margin-top: 24px; font-size: 11px; opacity: 0.85; letter-spacing: 0.05em; text-transform: uppercase; color: rgba(255, 255, 255, 0.9); }

  /* ---------- WhatsApp Chat system styles ---------- */
  .chat-list-view { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden; }
  .chat-list-

(function(){

  const appwriteCfg = window.APPWRITE_CONFIG || {

  };

  const { Client, Account, Databases, Storage, ID, Query } = window.Appwrite || {};
  let client = null;
  let account = null;
  let databases = null;
  let storage = null;

  if (window.Appwrite) {
    client = new Client().setEndpoint(appwriteCfg.ENDPOINT).setProject(appwriteCfg.PROJECT_ID);
    account = new Account(client);
    databases = new Databases(client);
    storage = new Storage(client);
  }

  function setupBackButtonHandler() {
    try {
      if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.App) {
        const { App } = Capacitor.Plugins;
        let lastBackPress = 0;

        App.addListener('backButton', (data) => {
          const requestFlowOverlay = document.getElementById('requestFlowOverlay');
          if (requestFlowOverlay && requestFlowOverlay.classList.contains('open')) {
            if (typeof window.closeRequestFlowOverlay === 'function') {
              window.closeRequestFlowOverlay();
            } else {
              requestFlowOverlay.classList.remove('open');
            }
            return;
          }

          const browseOverlay = document.getElementById('browseOverlay');
          if (browseOverlay && browseOverlay.classList.contains('open')) {
            if (typeof window.closeBrowseOverlay === 'function') {
              window.closeBrowseOverlay();
            } else {
              browseOverlay.classList.remove('open');
              document.body.classList.remove('convo-open');
            }
            return;
          }

          const convoOverlay = document.getElementById('convoOverlay');
          if (convoOverlay && convoOverlay.classList.contains('open')) {
            if (typeof window.closeConversation === 'function') {
              window.closeConversation();
            } else {
              convoOverlay.classList.remove('open');
              document.body.classList.remove('convo-open');
            }
            return;
          }

          const nmOverlay = document.getElementById('nmOverlay');
          if (nmOverlay && !nmOverlay.hidden) {
            nmOverlay.hidden = true;
            return;
          }

          const modalOverlay = document.getElementById('modalOverlay');
          if (modalOverlay && !modalOverlay.hidden) {
            modalOverlay.hidden = true;
            return;
          }

          if (appSettings && appSettings.isAuthenticated && currentView !== 'dashboard') {
            const dashBtn = document.querySelector('[data-view="dashboard"]');
            if (dashBtn) {
              dashBtn.click();
            } else {
              currentView = 'dashboard';
              if (typeof renderView === 'function') renderView();
            }
            return;
          }

          const now = Date.now();
          if (now - lastBackPress < 2000) {
            App.exitApp();
          } else {
            lastBackPress = now;
            if (typeof showToast === 'function') {
              showToast("Press back again to exit");
            } else {
              alert("Press back again to exit");
            }
          }
        });
      }
    } catch (e) {
      console.error("Error setting up back button handler:", e);

  function setupPushNotifications() {
    try {
      if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.PushNotifications) {
        const { PushNotifications } = Capacitor.Plugins;

        if (Capacitor.getPlatform() === 'android') {
          PushNotifications.createChannel({
            id: 'default',
            name: 'Default Channel',
            description: 'Default notification channel',
            importance: 3,
            visibility: 1,
            sound: 'beep.wav'
          }).then(() => {
            console.log("Default push notification channel created/updated.");
          }).catch(err => {
            console.error("Failed to create notification channel:", err);
          });
        }

        PushNotifications.requestPermissions().then((result) => {
          if (result.receive === 'granted') {
            PushNotifications.register();
          } else {
            console.warn("Push notification permission denied.");
          }
        });

        PushNotifications.addListener('registration', (token) => {
          console.log("Push registration success, token: " + token.value);
          window.fcmTokenValue = token.value;
          saveFCMTokenToDatabase(token.value);
        });

        PushNotifications.addListener('registrationError', (error) => {
          console.error("Push registration error: " + error.error);
        });

        PushNotifications.addListener('pushNotificationReceived', (notification) => {
          console.log("Push received: ", notification);
          if (typeof showToast === 'function') {
            showToast(notification.title || "Notification", notification.body || "");
          } else {
            alert((notification.title || "Notification") + "\n" + (notification.body || ""));
          }
          if (typeof startBrowseSync === 'function') startBrowseSync();
          if (typeof startChatListener === 'function') startChatListener();
          if (typeof startApprovalsListener === 'function') startApprovalsListener();
        });

        PushNotifications.addListener('pushNotificationActionPerformed', (action) => {
          console.log("Push action performed: ", action);
          const data = action.notification.data;
          if (data && data.targetView) {
            if (typeof setView === 'function') {
              setView(data.targetView);
              if (data.targetView === 'chat' && data.chatRecipient) {
                setTimeout(() => {
                  if (typeof openConversation === 'function') {
                    openConversation(data.chatRecipient);
                  }
                }, 300);
              }
            }
          }
        });
      }
    } catch (e) {
      console.error("Error setting up push notifications:", e);
    }
  }

    for (let i = 0; i < str.length; i++) {
      hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    const colors = ['#1C2D5E', '#2D6A4F', '#6B4FA0', '#C9622A', '#0F4C81', '#5B3758', '#4A5859'];
    return colors[Math.abs(hash) % colors.length];

  function showToast(message, bodyText) {
    const toast = document.getElementById('toastNotification');
    const msgEl = document.getElementById('toastMessage');
    if (!toast || !msgEl) return;
    msgEl.innerText = bodyText || message;
    toast.classList.add('show');
    
    // Play sound notification
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 880Hz beep
      gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    } catch(e) { console.error("Audio failed", e); }

    setTimeout(() => {
      toast.classList.remove('show');
    }, 4000);

  async function fetchBrowseSchools() {
    if (!databases) return;
    try {
      const snap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, [Query.limit(100)]);
      const schools = [];
      snap.documents.forEach(d => {
        if (d.type !== 'community' && d.schoolName !== 'Ghana Education Service' && d.schoolName !== 'Science Coordinator' && d.email !== 'kpando.science.coordinator@gmail.com') {
          let items = [];
          try { items = typeof d.items === 'string' ? JSON.parse(d.items) : (d.items || []); } catch(e) { items = []; }
          const totalQty = items.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
          const totalVal = items.reduce((sum, item) => sum + ((Number(item.quantity) || 0) * (Number(item.cost) || 0)), 0);
          const categories = [...new Set(items.map(item => item.category))];
          
          schools.push({
            name: d.schoolName || d.$id,
            email: d.email || '',
            items: items,
            totalQty: totalQty,
            totalVal: totalVal,
            categories: categories
          });
        }
      });
      stemSchools = schools;
      
      if (currentView === 'browse') {
        renderBrowseList();
      }
    } catch(err) {
      console.error("Browse sync error:", err);
    }
  }

    if (client) {

  window.adjustRequestItemQty = function(itemId, amount) {
    const sel = selectedItemsMap[itemId];
    if (!sel) return;
    const availQty = sel.item.quantity - (sel.item.brokenQty || 0) - (sel.item.lostQty || 0) - (sel.item.lowStockQty || 0) - (sel.item.borrowedQty || 0);
    const newQty = Math.max(1, Math.min(Math.max(1, availQty), sel.quantity + amount));
    sel.quantity = newQty;
    
    const inputEl = document.getElementById('qty-input-' + itemId);
    if (inputEl) inputEl.value = newQty;

    updateRequestFlowTotalCost();
  };

  window.handleRequestItemQtyChange = function(itemId, value) {
    const sel = selectedItemsMap[itemId];
    if (!sel) return;
    const availQty = sel.item.quantity - (sel.item.brokenQty || 0) - (sel.item.lostQty || 0) - (sel.item.lowStockQty || 0) - (sel.item.borrowedQty || 0);
    let qty = parseInt(value, 10);
    if (isNaN(qty) || qty < 1) qty = 1;
    const maxVal = Math.max(1, availQty);
    if (qty > maxVal) qty = maxVal;
    sel.quantity = qty;
    
    const inputEl = document.getElementById('qty-input-' + itemId);
    if (inputEl) inputEl.value = qty;

    updateRequestFlowTotalCost();
  };

  async function submitBorrowRequest() {
    if (!appSettings.isAuthenticated || !db || !selectedSchool) return;
    
    const itemsSelected = Object.values(selectedItemsMap);
    if (itemsSelected.length === 0) return;
    
    const teacherName = document.getElementById('reqTeacherName').value.trim();
    const teacherPhone = document.getElementById('reqTeacherPhone').value.trim();
    const usageLocation = document.getElementById('reqUsageLocation').value;
    const startDate = document.getElementById('reqStartDate').value;
    const endDate = document.getElementById('reqEndDate').value;
    
    const startD = new Date(startDate);
    const endD = new Date(endDate);
    const today = new Date();
    today.setHours(0,0,0,0);
    
    if (startD < today) {
      alert("Start date must be today or in the future!");
      return;
    }
    if (endD <= startD) {
      alert("End date must be after the start date!");
      return;
    }

    try {
      const targetSchoolEmail = selectedSchool.email;
      const targetSchoolName = selectedSchool.name;

      const itemsArray = itemsSelected.map(sel => ({
        itemId: sel.item.id,
        itemName: sel.item.name,
        category: sel.item.category,
        quantity: Number(sel.quantity),
        cost: Number(sel.item.cost || 0)
      }));
      
      const requestPayload = {
        requesterEmail: appSettings.email,
        requesterSchool: appSettings.schoolName,
        requesterTown: appSettings.townName,
        requestingTeacherName: teacherName,
        requestingTeacherPhone: teacherPhone,
        targetSchoolEmail: targetSchoolEmail,
        targetSchool: targetSchoolName,
        items: JSON.stringify(itemsArray),
        usageLocation: usageLocation,
        startDate: startDate,
        endDate: endDate,
        status: "pending",
        disapprovalReason: "",
        requestedAt: new Date().toISOString(),
        reviewedAt: ""
      };

      try {
        if (!databases) throw new Error("Appwrite is not connected");
        console.log("Writing to equipment_requests:", requestPayload);
        await databases.createDocument(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.REQUESTS, ID.unique(), requestPayload);
        console.log("Write to equipment_requests succeeded");
      } catch (err1) {
        console.error("Failed to write to equipment_requests:", err1);
        throw new Error("Failed to write to equipment_requests: " + err1.message);
      }
      
      // Auto-generate system chat notification message
      const itemsListText = itemsSelected.map(sel => `${sel.item.name} (Qty ${sel.quantity})`).join(', ');
      const locText = usageLocation === 'requester_school' ? `${appSettings.schoolName} premises` : `${targetSchoolName} premises`;
      const systemMessageText = `[SYSTEM REQUEST] We have requested to use the following equipment: ${itemsListText}. Location: ${locText}. Dates: ${startDate} to ${endDate}. Please review our request under Approvals.`;
      
      try {
        const convoId = [appSettings.email, targetSchoolEmail].sort().join('_');
        await databases.createDocument(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.MESSAGES, ID.unique(), {
          convoId: convoId,
          sender: appSettings.email,
          recipient: targetSchoolEmail,
          text: systemMessageText,
          createdAt: new Date().toISOString(),
          read: false
        });
      } catch (err2) {
        console.error("Failed to write to messages:", err2);
      }
      
      showToast("Borrow request submitted successfully!");
      
      closeRequestFlowOverlay();
      closeBrowseOverlay();
      
      selectedItemsMap = {};
      updateBrowseBottomBar();
      
      currentView = 'dashboard';
      render();

    } catch(err) {
      console.error("Failed to submit request:", err);
      alert("Failed to submit request: " + err.message);
    }
  }

  async function fetchChatMessages() {
    if (!databases || !appSettings.email) return;
    try {
      const res = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.MESSAGES, [
        Query.limit(100),
        Query.orderAsc('createdAt')
      ]);
      const list = [];
      res.documents.forEach(doc => {
        const m = {
          id: doc.$id,
          senderEmail: doc.sender,
          recipientEmail: doc.recipient,
          senderSchool: doc.senderSchool || (doc.sender === 'master' ? 'Science Coordinator' : doc.sender),
          text: doc.text,
          timestamp: doc.createdAt || doc.$createdAt,
          ...doc
        };

        const isRelated = (m.senderEmail === appSettings.email) || (m.recipientEmail === appSettings.email) || (m.recipientEmail === 'broadcast');
        if (isRelated) {
          list.push(m);
        }
      });

      chatMessages = list;

      unreadCounts = {};
      list.forEach(m => {
        if (m.senderEmail === appSettings.email) return;
        const senderKey = m.senderEmail;
        const msgTime = new Date(m.timestamp).getTime() || 0;
        const lastRead = lastReadTimestamps[senderKey] ? new Date(lastReadTimestamps[senderKey]).getTime() : 0;

        if (msgTime > lastRead) {
          unreadCounts[senderKey] = (unreadCounts[senderKey] || 0) + 1;
        }

        const senderName = m.senderSchool || m.senderEmail;
        if (!recentChats.some(r => r.email === senderKey)) {
          addToRecentChats(senderKey, senderName);
        }
      });

      updateChatBadge();

      if (currentView === 'chat') {
        const convoOv = document.getElementById('convoOverlay');
        if (convoOv && convoOv.classList.contains('open')) {
          renderConvoMessages();
        } else {
          const root = document.getElementById('view');
          if (root) root.innerHTML = chatListViewHTML();
        }
      }
    } catch(err) {
      console.error("Chat fetch error:", err);
    }
  }

  function startChatListener() {
    fetchChatMessages();
    if (client) {
      if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
      chatUnsubscribe = client.subscribe(`databases.${appwriteCfg.DATABASE_ID}.collections.${appwriteCfg.COLLECTIONS.MESSAGES}.documents`, () => {
        fetchChatMessages();
      });
    }
  }

  async function fetchApprovals() {
    if (!databases || !appSettings.email) return;
    try {
      const res = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.REQUESTS, [
        Query.equal('requesterEmail', appSettings.email),
        Query.limit(100)
      ]);
      const list = [];
      res.documents.forEach(doc => {
        if (doc.archived) return;
        let items = [];
        try { items = typeof doc.items === 'string' ? JSON.parse(doc.items) : (doc.items || []); } catch(e) { items = []; }
        list.push({ ...doc, id: doc.$id, items: items });
      });

      if (!approvalsInitialLoad) {
        list.forEach(newReq => {
          const oldReq = outgoingRequests.find(o => o.id === newReq.id);
          if (oldReq && oldReq.status !== newReq.status) {
            if (newReq.status === 'approved') {
              showToast(`Your request to ${newReq.targetSchool} has been approved!`);
            } else if (newReq.status === 'disapproved') {
              showToast(`Your request to ${newReq.targetSchool} was disapproved: ${newReq.disapprovalReason || 'No reason specified'}`);
            } else if (newReq.status === 'returned') {
              showToast(`Return confirmed by ${newReq.targetSchool}!`);
            }
          }
        });
      }
      approvalsInitialLoad = false;

      outgoingRequests = list.sort((a, b) => new Date(b.requestedAt || b.$createdAt || 0) - new Date(a.requestedAt || a.$createdAt || 0));
      updateApprovalsBadge();

      if (currentView === 'approvals') {
        renderApprovalsList();
      } else if (currentView === 'dashboard') {
        render();
      }
    } catch(err) {
      console.error("Approvals fetch error:", err);
    }
  }

  function startApprovalsListener() {
    fetchApprovals();
    if (client) {
      if (approvalsUnsubscribe) { approvalsUnsubscribe(); approvalsUnsubscribe = null; }
      approvalsUnsubscribe = client.subscribe(`databases.${appwriteCfg.DATABASE_ID}.collections.${appwriteCfg.COLLECTIONS.REQUESTS}.documents`, () => {
        fetchApprovals();
      });
    }
  }

  /* =====================================================
     TIME AGO UTILITY
  ===================================================== */
  function timeAgo(date) {
    if (!date) return 'some time ago';
    const seconds = Math.floor((new Date() - new Date(date)) / 1000);
    if (seconds < 0) return 'just now';
    
    let interval = Math.floor(seconds / 31536000);
    if (interval >= 1) return interval + " y" + " ago";
    interval = Math.floor(seconds / 2592000);
    if (interval >= 1) return interval + " mo" + " ago";
    interval = Math.floor(seconds / 86400);
    if (interval >= 1) return interval + " d" + " ago";
    interval = Math.floor(seconds / 3600);
    if (interval >= 1) return interval + " h" + " ago";
    interval = Math.floor(seconds / 60);
    if (interval >= 1) return interval + " m" + " ago";
    return "just now";
  }

    const topbar = document.querySelector('.topbar');
    const bottomNav = document.querySelector('.bottom-nav');
    const isAuthView = (currentView === 'login');
    const isChatView = (currentView === 'chat');

    if (topbar) topbar.style.display = (isAuthView || isChatView) ? 'none' : 'flex';
    if (bottomNav) bottomNav.style.display = isAuthView ? 'none' : 'flex';

    if (!appSettings.isAuthenticated) {
      currentView = 'login';
      root.innerHTML = loginHTML();
      return;
    }

    if (currentView === 'dashboard') {
      root.innerHTML = dashboardHTML();
    } else if (currentView === 'browse') {
      root.innerHTML = browseHTML();
      renderBrowseList();
    } else if (currentView === 'chat') {
      root.innerHTML = chatListViewHTML();
    } else if (currentView === 'approvals') {
      root.innerHTML = approvalsHTML();
      renderApprovalsList();
    } else if (currentView === 'settings') {
      root.innerHTML = settingsHTML();
    } else if (currentView === 'schoolPicker') {
      root.innerHTML = schoolPickerHTML(window.availableSchools || []);
    }

  window.handleSettingsPhotoUpload = function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 150;
        const MAX_HEIGHT = 150;
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
        } else {
          if (height > MAX_HEIGHT) {
            width *= MAX_HEIGHT / height;
            height = MAX_HEIGHT;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

        db.collection('schools').doc(appSettings.schoolName).update({
          photoUrl: dataUrl
        }).then(() => {
          appSettings.photoUrl = dataUrl;
          localStorage.setItem('stem_community_settings', JSON.stringify(appSettings));
          alert("Profile photo updated successfully!");
          renderView();
        }).catch(err => {
          console.error("Error updating photoUrl: ", err);
          alert("Error updating profile photo: " + err.message);
        });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };

          <p class="page-subtitle">District Chat Hub</p>
        </div>
        <button class="btn btn-primary" onclick="openNewMessageSheet()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="display:inline-block; vertical-align:middle; margin-right:4px;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          New Chat
        </button>
      </div>

      <div class="chat-list-view">
        <div class="chat-list-body">
          ${rowsHTML}
        </div>
      </div>
    `;
  }

  function getLastMessageForRecipient(email) {
    const thread = chatMessages.filter(m => 
      (m.senderEmail === email && m.recipientEmail === appSettings.email) ||
      (m.senderEmail === appSettings.email && m.recipientEmail === email)
    );
    return thread[thread.length - 1] || null;
  }

  window.openNewMessageSheet = function() {
    const listEl = document.getElementById('nmSchoolList');
    if (!listEl) return;

    let html = `
      <div class="recent-chat-row" onclick="selectNewRecipient('master', 'Science Coordinator')">
        <div class="chat-avatar" style="background:var(--primary);">SC</div>
        <div class="recent-chat-info">
          <div class="recent-chat-name">Science Coordinator</div>
          <div class="recent-chat-snippet">District Administrator</div>
        </div>
      </div>
    `;

    registeredSchools.forEach(s => {
      html += `
        <div class="recent-chat-row" onclick="selectNewRecipient('${escapeHtml(s.email)}', '${escapeHtml(s.name)}')">
          <div class="chat-avatar" style="background:${getAvatarColor(s.email)}">${getInitials(s.name)}</div>
          <div class="recent-chat-info">
            <div class="recent-chat-name">${escapeHtml(s.name)}</div>
            <div class="recent-chat-snippet">${escapeHtml(s.email)}</div>
          </div>
        </div>
      `;
    });

    listEl.innerHTML = html;
    document.getElementById('nmOverlay').hidden = false;
  };

  window.closeNewMessageSheet = function() {
    document.getElementById('nmOverlay').hidden = true;
  };

  window.selectNewRecipient = function(email, name) {
    closeNewMessageSheet();
    if (!recentChats.some(r => r.email === email)) {
      addToRecentChats(email, name);
    }
    openConversation(email);
  };

  /* ---------- Chat Long Press Deletion & Open ---------- */
  let touchTimer = null;
  window.isLongPressing = false;

  window.chatRowTouchStart = function(event, email) {
    if (touchTimer) clearTimeout(touchTimer);
    touchTimer = setTimeout(() => {
      touchTimer = null;
      window.isLongPressing = true;
      window.confirmDeleteConversation(email);
    }, 600);
  };

  window.chatRowTouchEnd = function(event, email) {
    if (touchTimer) {
      clearTimeout(touchTimer);
      touchTimer = null;
    }
  };

  window.chatRowMouseDown = function(event, email) {
    if (touchTimer) clearTimeout(touchTimer);
    touchTimer = setTimeout(() => {
      touchTimer = null;
      window.isLongPressing = true;
      window.confirmDeleteConversation(email);
    }, 600);
  };

  window.chatRowMouseUp = function(event, email) {
    if (touchTimer) {
      clearTimeout(touchTimer);
      touchTimer = null;
    }
  };

  window.chatRowMouseLeave = function(event) {
    if (touchTimer) {
      clearTimeout(touchTimer);
      touchTimer = null;
    }
  };

  window.confirmDeleteConversation = function(email) {
    const schoolName = email === 'master' ? 'Science Coordinator' : (getNameForEmail(email) || email);
    if (confirm(`Delete Conversation?\n\nWarning: This action will permanently delete all messages in this conversation for both schools. This cannot be undone.`)) {
      db.collection('chat_messages')
        .where('senderEmail', 'in', [appSettings.email, email])
        .where('recipientEmail', 'in', [appSettings.email, email])
        .get()
        .then(snapshot => {
          const batch = db.batch();
          let count = 0;
          snapshot.forEach(doc => {
            const d = doc.data();
            // Ensure exact matching of sender/recipient pair (necessary due to 'in' query limitations)
            if ((d.senderEmail === appSettings.email && d.recipientEmail === email) ||
                (d.senderEmail === email && d.recipientEmail === appSettings.email)) {
              batch.delete(doc.ref);
              count++;
            }
          });
          if (count > 0) {
            return batch.commit();
          }
        })
        .then(() => {
          if (typeof showToast === 'function') {
            showToast("Conversation deleted");
          } else {
            alert("Conversation deleted");
          }
          if (typeof renderView === 'function') renderView();
        })
        .catch(err => {
          console.error("Error deleting conversation: ", err);
          alert("Error deleting conversation: " + err.message);
        });
    } else {
      window.isLongPressing = false;
    }
  };

  /* ---------- Open / Close Conversation ---------- */
  window.openConversation = function(email) {
    if (window.isLongPressing) {
      window.isLongPressing = false;
      return;
    }
    currentChatRecipient = email;
    const name = email === 'master' ? 'Science Coordinator' : getNameForEmail(email);

    document.getElementById('convoName').innerText = name;
    const avatar = document.getElementById('convoAvatar');
    if (avatar) {
      const photo = getPhotoUrlForEmail(email);
      if (photo) {
        avatar.innerHTML = `<img src="${photo}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
        avatar.style.background = 'none';
      } else {
        avatar.innerHTML = '';
        avatar.innerText = getInitials(name);
        avatar.style.background = email === 'master' ? 'var(--primary)' : getAvatarColor(email);
      }
    }

    document.body.classList.add('convo-open');
    document.getElementById('convoOverlay').classList.add('open');

    // Acknowledge read messages
    lastReadTimestamps[email] = new Date().toISOString();
    saveLastReadTimestamps();
    updateChatBadge();

    renderConvoMessages();
  };

  function getNameForEmail(email) {
    if (email === 'master') return 'Science Coordinator';
    const s = registeredSchools.find(school => school.email === email);
    if (s) return s.name;
    const recent = recentChats.find(r => r.email === email);
    if (recent) return recent.name;
    return email;
  }

  function getPhotoUrlForEmail(email) {
    if (email === 'master') return null;
    const s = registeredSchools.find(school => school.email === email);
    return s ? s.photoUrl : null;
  }

  window.closeConversation = function() {
    document.body.classList.remove('convo-open');
    document.getElementById('convoOverlay').classList.remove('open');
    currentChatRecipient = null;
    
    if (currentView === 'chat') {
      const root = document.getElementById('view');
      if (root) root.innerHTML = chatListViewHTML();
    }
  };

  function renderConvoMessages() {
    const area = document.getElementById('convoMessages');
    if (!area || !currentChatRecipient) return;

    const thread = chatMessages.filter(m => 
      (m.senderEmail === currentChatRecipient && m.recipientEmail === appSettings.email) ||
      (m.senderEmail === appSettings.email && m.recipientEmail === currentChatRecipient)
    );

    if (thread.length === 0) {
      area.innerHTML = `<div style="text-align:center; font-size:12px; color:var(--ink-soft); margin-top:20px;">No messages in this chat thread. Type below to start conversation.</div>`;
      return;
    }

    area.innerHTML = thread.map(m => {
      const isMine = m.senderEmail === appSettings.email;
      let ts = m.timestamp;
      if (ts && typeof ts.toDate === 'function') ts = ts.toDate();
      const timeStr = ts ? (new Date(ts).toLocaleDateString([], {month:'short', day:'numeric'}) + ', ' + new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})) : 'Now';

      return `
        <div class="msg-bubble ${isMine ? 'sent' : 'received'}">
          <div style="font-weight:600; font-size:11px; margin-bottom:2px; opacity:0.85;">${escapeHtml(isMine ? 'You' : (m.senderSchool || 'User'))}</div>
          <div>${escapeHtml(m.text)}</div>
          <div class="msg-meta">${timeStr}</div>
        </div>
      `;
    }).join('');

    setTimeout(() => { area.scrollTop = area.scrollHeight; }, 50);
  }

  /* =====================================================
     MESSAGE FORM SUBMIT
  ===================================================== */
  
  window.handleChatSubmit = async function(e) {
    e.preventDefault();
    if (!appSettings.isAuthenticated || !databases || !currentChatRecipient) return;
    const input = document.getElementById('convoInput');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;

    input.value = '';

    try {
      const convoId = [appSettings.email, currentChatRecipient].sort().join('_');
      await databases.createDocument(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.MESSAGES, ID.unique(), {
        convoId: convoId,
        sender: appSettings.email,
        recipient: currentChatRecipient,
        text: text,
        createdAt: new Date().toISOString(),
        read: false
      });

      lastReadTimestamps[currentChatRecipient] = Date.now();
      saveLastReadTimestamps();
      fetchChatMessages();
    } catch(err) {
      console.error("Failed to send message:", err);
      alert("Failed to send message: " + err.message);
    }
  };

  /* =====================================================
     GLOBAL INTERACTION LISTENERS
  ===================================================== */
  
  function setupGlobalListeners() {
    document.body.addEventListener('click', async e => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;

      if (action === 'set-view') {
        // Close conversation overlay if open
        const convoOv = document.getElementById('convoOverlay');
        if (convoOv && convoOv.classList.contains('open')) {
          convoOv.classList.remove('open');
          document.body.classList.remove('convo-open');
          currentChatRecipient = null;
        }

        currentView = el.dataset.view;
        document.getElementById('sidebar').classList.remove('open');
        render();
      } else if (action === 'goto-login') {
        currentView = 'login';
        render();
      } else if (action === 'toggle-sidebar') {
        document.getElementById('sidebar').classList.toggle('open');
      } else if (action === 'logout') {
        try {
          if (databases && appSettings.schoolName) {
            try {
              const snap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, [Query.equal('schoolName', appSettings.schoolName)]);
              if (snap.documents.length > 0) {
                const doc = snap.documents[0];
                const currentActive = doc.activeLogins || 0;
                const nextActive = Math.max(0, currentActive - 1);
                await databases.updateDocument(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, doc.$id, {
                  activeLogins: nextActive
                });
              }
            } catch(err) {
              console.error("Error decrementing activeLogins: ", err);
            }
          }
          if (account) {
            account.deleteSession('current').catch(console.error);
          }
          appSettings = { schoolName: '', email: '', personName: '', townName: '', isAuthenticated: false };
          localStorage.removeItem('stem_community_settings');
          if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
          if (approvalsUnsubscribe) { approvalsUnsubscribe(); approvalsUnsubscribe = null; }
          if (browseUnsubscribe) { browseUnsubscribe(); browseUnsubscribe = null; }
          selectedItemsMap = {};
          approvalsInitialLoad = true;
          currentView = 'login';
          const sidebar = document.getElementById('sidebar');
          if (sidebar) sidebar.classList.remove('open');
          render();
        } catch(err) {
          console.error(err);
        }
      }
    });

    // Form handlers
    document.body.addEventListener('submit', async e => {
      if (e.target.id === 'loginForm') {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim().toLowerCase();
        const password = document.getElementById('loginPassword').value.trim();

        try {
          if (!databases) throw new Error("Appwrite is not connected");
          
          // Check if account is revoked
          const revokeSnap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.REVOKED, [Query.equal('email', email)]);
          if (revokeSnap.documents.length > 0) {
            alert("Access Denied: This account has been removed by the Science Coordinator.");
            return;
          }

          const snap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, [
            Query.equal('email', email)
          ]);
          
          if (snap.documents.length > 0) {
            const profile = snap.documents[0];
            const expectedPassword = profile.currentPassword || 'password123';
            if (password !== expectedPassword) {
              alert("Incorrect master password for " + (profile.schoolName || email));
              return;
            }

            if (profile.type === 'community') {
              const max = profile.maxLogins !== undefined ? profile.maxLogins : 3;
              const active = profile.activeLogins !== undefined ? profile.activeLogins : 0;
              if (active >= max) {
                alert(`Login limit reached (${active}/${max}). Contact the Science Coordinator to refresh your logins.`);
                return;
              }

              await databases.updateDocument(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, profile.$id, {
                activeLogins: active + 1
              });

              if (account) {
                try {
                  await account.createEmailPasswordSession(email, password);
                } catch(authErr) {
                  // Session fallback
                }
              }

              appSettings.isAuthenticated = true;
              appSettings.email = email;
              appSettings.schoolName = profile.schoolName;
              appSettings.personName = profile.personName || '';
              appSettings.townName = profile.townName || '';
              
              localStorage.setItem('stem_community_settings', JSON.stringify(appSettings));
              currentView = 'dashboard';
              startAccountListener();
              startChatListener();
              startApprovalsListener();
              startBrowseSync();
              fetchRegisteredSchools();
              render();
            } else {
              alert("Access Denied: This app is strictly for Kpando STEM Community schools.");
            }
          } else {
            alert("No registered community school profile found for this account.");
          }
        } catch(err) {
          alert("Login error: " + err.message);
        }
      } else if (e.target.id === 'convoForm') {
        handleChatSubmit(e);
      } else if (e.target.id === 'requestFlowForm') {
        e.preventDefault();
        await submitBorrowRequest();
      }
    });

    const overlay = document.getElementById('modalOverlay');
    if (overlay) {
      overlay.addEventListener('click', e => {
        if (e.target.id === 'modalOverlay') closeModal();
      });
    }
  }

  async function checkOverdueReturns() {
    if (!databases || !appSettings.email) return;
    
    const todayStr = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
    
    try {
      const snap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.REQUESTS, [
        Query.equal('requesterEmail', appSettings.email),
        Query.equal('status', 'approved')
      ]);
        
      snap.documents.forEach(req => {
        if (req.endDate && req.endDate <= todayStr) {
          showToast(
            "Overdue Equipment Return",
            `Your borrow from ${req.targetSchool} was due on ${req.endDate}. Please initiate return under the Approvals tab.`
          );

          if (typeof window.Capacitor !== 'undefined' && window.Capacitor.isPluginAvailable && window.Capacitor.isPluginAvailable('LocalNotifications')) {
            window.Capacitor.Plugins.LocalNotifications.schedule({
              notifications: [{
                title: "Equipment Return Overdue",
                body: `Your borrow from ${req.targetSchool} was due on ${req.endDate}. Please return it.`,
                id: Math.floor(Math.random() * 100000),
                schedule: { at: new Date(Date.now() + 1000) }
              }]
            });
          }
        }
      });
    } catch (err) {
      console.error("Error checking overdue returns:", err);
    }
  }

  /* =====================================================
     INIT
  ===================================================== */
  async function init() {
    try {
      if (appSettings.isAuthenticated && appSettings.email) {
        if (databases) {
          try {
            const revSnap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.REVOKED, [Query.equal('email', appSettings.email)]);
            if (revSnap.documents.length > 0) {
              alert("Access Denied: This school account has been removed by the Science Coordinator.");
              appSettings.isAuthenticated = false;
              localStorage.removeItem('stem_community_settings');
              currentView = 'login';
              render();
              return;
            }
          } catch(e) {
            console.error("Revocation check error:", e);
          }
        }

        startAccountListener();
        startChatListener();
        startApprovalsListener();
        startBrowseSync();
        fetchRegisteredSchools();
        checkOverdueReturns();
        if (currentView === 'login' || currentView === 'register') {
          currentView = 'dashboard';
        }
      } else {
        currentView = 'login';
      }

      setupGlobalListeners();
      setupPushNotifications();
      render();

      let pct = 0;
      const pctEl = document.getElementById('splashPercent');
      const iv = setInterval(() => {
        pct += 5;
        if (pctEl) pctEl.style.width = Math.min(pct, 100) + '%';
        if (pct >= 100) {
          clearInterval(iv);
          const splash = document.getElementById('splashScreen');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 500);
          }
        }
      }, 50);

    } catch(err) {
      console.error(err);
      alert("Error initializing app: " + err.message);
    }
  }

  /* =====================================================
     SWIPE NAVIGATION (DASHBOARD, BROWSE, MESSAGES, APPROVALS, SETTINGS)
  ===================================================== */
  (function() {
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    const views = ['dashboard', 'browse', 'chat', 'approvals', 'settings'];

    document.addEventListener('touchstart', e => {
      if (currentView === 'login' || currentView === 'register') return;
      if (document.getElementById('convoOverlay') && document.getElementById('convoOverlay').classList.contains('open')) return;
      if (document.getElementById('browseOverlay') && document.getElementById('browseOverlay').classList.contains('open')) return;
      if (document.getElementById('requestFlowOverlay') && document.getElementById('requestFlowOverlay').classList.contains('open')) return;
      if (document.getElementById('nmOverlay') && !document.getElementById('nmOverlay').hidden) return;
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      if (currentView === 'login' || currentView === 'register') return;
      if (document.getElementById('convoOverlay') && document.getElementById('convoOverlay').classList.contains('open')) return;
      if (document.getElementById('browseOverlay') && document.getElementById('browseOverlay').classList.contains('open')) return;
      if (document.getElementById('requestFlowOverlay') && document.getElementById('requestFlowOverlay').classList.contains('open')) return;
      if (document.getElementById('nmOverlay') && !document.getElementById('nmOverlay').hidden) return;
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;

      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.abs(diffX) > 60 && Math.abs(diffY) < 40) {
        const currentIndex = views.indexOf(currentView);
        if (currentIndex === -1) return;

        if (diffX < 0) {
          if (currentIndex < views.length - 1) {
            currentView = views[currentIndex + 1];
            render();
          }
        } else {
          if (currentIndex > 0) {
            currentView = views[currentIndex - 1];
            render();
          }
        }
      }
    }
  })();

  init();

})();
</script>
