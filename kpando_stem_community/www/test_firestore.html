<!DOCTYPE html>
<html>
<head>
  <title>Firestore Diagnostics</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #f5f5f5;">
  <h1>Firestore Diagnostics</h1>
  
  <div style="margin-bottom: 20px; background: white; padding: 15px; border: 1px solid #ddd; border-radius: 4px;">
    <h3>1. Authenticate</h3>
    <input type="email" id="authEmail" placeholder="Email" style="padding: 6px; width: 200px;">
    <input type="password" id="authPassword" placeholder="Password" style="padding: 6px; width: 150px;">
    <button onclick="login()">Log In</button>
    <span id="authStatus" style="margin-left: 10px; font-weight: bold; color: #666;">Not logged in</span>
  </div>

  <div style="margin-bottom: 20px;">
    <h3>2. Fetch Collection Data</h3>
    <button onclick="checkData()">Fetch Firestore Data</button>
  </div>

  <div id="output" style="white-space: pre-wrap; font-family: monospace; background: white; padding: 15px; border: 1px solid #ccc; border-radius: 4px;">Click the button to fetch...</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAglujmMOheEDXPBfwFDNepngWpp3CT6sk",
      authDomain: "stem-ledger.firebaseapp.com",
      projectId: "stem-ledger",
      storageBucket: "stem-ledger.firebasestorage.app",
      messagingSenderId: "1065092724638",
      appId: "1:1065092724638:web:09e020e2252e48b47c488f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    firebase.auth().onAuthStateChanged(user => {
      const status = document.getElementById('authStatus');
      if (user) {
        status.innerText = "Logged in as: " + user.email;
        status.style.color = "green";
      } else {
        status.innerText = "Not logged in";
        status.style.color = "red";
      }
    });

    async function login() {
      const email = document.getElementById('authEmail').value.trim();
      const pass = document.getElementById('authPassword').value;
      try {
        await firebase.auth().signInWithEmailAndPassword(email, pass);
        alert("Logged in successfully!");
      } catch(err) {
        alert("Login failed: " + err.message);
      }
    }

    async function checkData() {
      const out = document.getElementById('output');
      out.innerHTML = "Fetching...\n";
      
      try {
        // 1. Fetch schools
        out.innerHTML += "--- SCHOOLS ---\n";
        const schoolsSnap = await db.collection('schools').get();
        schoolsSnap.forEach(doc => {
          out.innerHTML += `Doc ID: ${doc.id} => ${JSON.stringify(doc.data(), null, 2)}\n`;
        });

        // 2. Fetch equipment_requests
        out.innerHTML += "\n--- EQUIPMENT REQUESTS ---\n";
        const reqsSnap = await db.collection('equipment_requests').get();
        reqsSnap.forEach(doc => {
          out.innerHTML += `Doc ID: ${doc.id} => ${JSON.stringify(doc.data(), null, 2)}\n`;
        });
      } catch (err) {
        out.innerHTML += "\nERROR: " + err.message + "\n";
      }
    }
  </script>
</body>
</html>
