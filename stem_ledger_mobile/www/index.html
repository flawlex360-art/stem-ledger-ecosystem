<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flawlex STEM Ledger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap');

*{ box-sizing: border-box; }

:root {
  --bg: #F7F8FA;
  --surface: #FFFFFF;
  --surface-card: #FFFFFF;
  --surface-2: #F1F3F5;
  --surface-subtle: #F1F3F5;
  --surface-hover: #ECEEF1;
  --ink: #111827;
  --ink-soft: #4B5563;
  --ink-muted: #9CA3AF;
  --border: #E5E7EB;
  --border-subtle: #F3F4F6;
  --primary: #1B2B5E;
  --primary-600: #2563EB;
  --primary-soft: rgba(37,99,235,0.07);
  --primary-glow: rgba(37,99,235,0.15);
  --accent: #1B2B5E;
  --accent-600: #2563EB;
  --accent-soft: rgba(37,99,235,0.07);
  --success: #059669;
  --success-soft: rgba(5,150,105,0.08);
  --success-border: rgba(5,150,105,0.15);
  --warning: #D97706;
  --warning-soft: rgba(217,119,6,0.08);
  --warning-border: rgba(217,119,6,0.15);
  --danger: #DC2626;
  --danger-soft: rgba(220,38,38,0.06);
  --danger-border: rgba(220,38,38,0.12);
  --science: #2D6A4F;
  --it: #0891B2;
  --math: #C2410C;
  --engineering: #7C3AED;
  --radius: 12px;
  --radius-xl: 20px;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --radius-full: 9999px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
  --shadow-md: 0 4px 12px -1px rgba(0,0,0,0.06), 0 2px 4px -1px rgba(0,0,0,0.03);
  --shadow-card: 0 4px 12px -1px rgba(0,0,0,0.06), 0 2px 4px -1px rgba(0,0,0,0.03);
  --shadow-hover: 0 10px 25px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.03);
  --shadow-lg: 0 10px 25px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.03);
  --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}

  font-family: var(--font-body);
  background-color: var(--bg);
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'400'%20height%3D'400'%20fill%3D'none'%3E%3Ccircle cx='80' cy='65' r='3.5' fill='%231B2B5E' opacity='.25'/%3E%3Cellipse cx='80' cy='65' rx='22' ry='9' stroke='%231B2B5E' stroke-width='1.5' opacity='.20' transform='rotate(-35 80 65)'/%3E%3Cellipse cx='80' cy='65' rx='22' ry='9' stroke='%231B2B5E' stroke-width='1.5' opacity='.20' transform='rotate(35 80 65)'/%3E%3Cellipse cx='80' cy='65' rx='22' ry='9' stroke='%231B2B5E' stroke-width='1.5' opacity='.20'/%3E%3Cpath d='M300 75v22l-6 14h28l-6-14V75z' stroke='%231B2B5E' stroke-width='1.5' opacity='.20' stroke-linejoin='round'/%3E%3Cline x1='295' y1='80' x2='317' y2='80' stroke='%231B2B5E' stroke-width='1.5' opacity='.15'/%3E%3Ccircle cx='306' cy='100' r='2' fill='%231B2B5E' opacity='.15'/%3E%3Ccircle cx='200' cy='200' r='12' stroke='%231B2B5E' stroke-width='1.5' opacity='.20'/%3E%3Ccircle cx='200' cy='200' r='5' stroke='%231B2B5E' stroke-width='1.5' opacity='.20'/%3E%3Cline x1='200' y1='188' x2='200' y2='193' stroke='%231B2B5E' stroke-width='1.5' opacity='.20'/%3E%3Cline x1='200' y1='207' x2='200' y2='212' stroke='%231B2B5E' stroke-width='1.5' opacity='.20'/%3E%3Cline x1='188' y1='200' x2='193' y2='200' stroke='%231B2B5E' stroke-width='1.5' opacity='.20'/%3E%3Cline x1='207' y1='200' x2='212' y2='200' stroke='%231B2B5E' stroke-width='1.5' opacity='.20'/%3E%3Cpath d='M90 320h25v-30h30v30h25' stroke='%231B2B5E' stroke-width='1.5' opacity='.20' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='115' cy='320' r='3' fill='%231B2B5E' opacity='.20'/%3E%3Ccircle cx='145' cy='290' r='3' fill='%231B2B5E' opacity='.20'/%3E%3Cpath d='M345 25q14 18-2 36q-16 18 2 36' stroke='%231B2B5E' stroke-width='1.5' opacity='.20'/%3E%3Cpath d='M358 25q-14 18 2 36q16 18-2 36' stroke='%231B2B5E' stroke-width='1.5' opacity='.20'/%3E%3Cline x1='343' y1='43' x2='360' y2='43' stroke='%231B2B5E' stroke-width='1' opacity='.15'/%3E%3Cli d'/%3E%3Ctext x='110' y='215' font-family='serif' font-style='italic' font-size='12' font-weight='bold' fill='%231B2B5E' opacity='.20'%3Ef(x)%3C/text%3E%3Cpath d='M40 95 h14' stroke='%231B2B5E' stroke-width='1.5' opacity='.20' stroke-linecap='round'/%3E%3Ccircle cx='47' cy='90' r='1.5' fill='%231B2B5E' opacity='.20'/%3E%3Ccircle cx='47' cy='100' r='1.5' fill='%231B2B5E' opacity='.20'/%3E%3Cpath d='M250 50 a15 15 0 0 1 30 0 z' stroke='%231B2B5E' stroke-width='1.5' fill='none' opacity='.20' stroke-linejoin='round'/%3E%3Ccircle cx='265' cy='48' r='1.5' fill='%231B2B5E' opacity='.20'/%3E%3Cpath d='M30 25 l15 -10 l4 6 l-15 10 z' stroke='%231B2B5E' stroke-width='1.5' fill='none' opacity='.20' stroke-linejoin='round'/%3E%3Cpath d='M45 15 l8 -5 l4 6 l-8 5' stroke='%231B2B5E' stroke-width='1.5' fill='none' opacity='.20' stroke-linejoin='round'/%3E%3Cpath d='M35 25 l-10 15 M40 30 l5 15' stroke='%231B2B5E' stroke-width='1.2' opacity='.15' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 400px 400px;
  background-attachment: fixed;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body.convo-open { overflow: hidden !important; height: 100vh !important; }

/* ---------- Layout ---------- */
.app{ display:flex; min-height:100vh; }

.sidebar{
  width:268px; flex-shrink:0; background:var(--surface);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column; gap:28px;
  padding:24px 20px; position:sticky; top:0; height:100vh; overflow-y:auto; z-index:40;
}
.main{ flex:1; padding:28px 36px 60px; min-width:0; }

/* ---------- Brand ---------- */
.brand{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
.brand-title{ font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:-0.01em; }
.brand-sub{ font-size:12px; color:var(--ink-soft); }

/* ---------- Nav ---------- */
.nav{ display:flex; flex-direction:column; gap:4px; }
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:var(--radius-sm);
  border:none; background:transparent; cursor:pointer;
  font-family:var(--font-body); font-size:14px; font-weight:500;
  color:var(--ink-soft); text-align:left; width:100%;
}
.nav-item:hover{ background:var(--surface-2); color:var(--ink); }
.nav-item.active{ background:var(--primary-soft); color:var(--primary); font-weight:600; }

/* ---------- Sidebar sections ---------- */
.sidebar-section{ display:flex; flex-direction:column; gap:4px; }
.sidebar-section.data-section{ margin-top:auto; gap:6px; }
.sidebar-label{ font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px; }

.category-nav-item{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:8px 12px; border-radius:var(--radius-sm); border:none; background:transparent;
  cursor:pointer; font-size:13px; color:var(--ink); text-align:left;
}
.category-nav-item:hover{ background:var(--surface-2); }
.category-nav-item.active{ background:var(--surface-2); font-weight:600; }
.category-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.category-nav-item .count{ margin-left:auto; color:var(--ink-soft); font-family:var(--font-mono); font-size:12px; }

/* ---------- Buttons ---------- */
.btn {
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
  letter-spacing: 0.01em;
}
.btn:hover { background: var(--surface-2); }
.btn-primary {
  background: var(--primary-600); border-color: var(--primary-600); color: #fff;
  box-shadow: 0 1px 3px rgba(27,43,94,0.3);
}
.btn-primary:hover { background: var(--primary); border-color: var(--primary); }
.btn-primary:hover {
  background: #162450;
  border-color: #162450;
}
.btn-ghost{ border-color:transparent; background:transparent; color:var(--ink-soft); justify-content:flex-start; width:100%; font-weight:500; }
.btn-ghost:hover{ background:var(--surface-2); color:var(--ink); }

/* ---------- Topbar ---------- */
.topbar{ display:flex; gap:14px; align-items:center; margin-bottom:24px; flex-wrap:wrap; }
.search-wrap{ flex:1; min-width:220px; }
.search-wrap input{
  width:100%; padding:10px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface); font-family:var(--font-body); font-size:14px; color:var(--ink);
}
.search-wrap input:focus{ outline:2px solid var(--primary); outline-offset:1px; }
.menu-toggle{ display:none; border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); padding:8px 11px; cursor:pointer; font-size:15px; }

/* ---------- Page header ---------- */
.page-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; gap:24px; flex-wrap:wrap; }
.page-title{ font-family:var(--font-display); font-size:26px; font-weight:700; margin:0 0 4px; letter-spacing:-0.01em; }
.page-subtitle{ color:var(--ink-soft); font-size:14px; margin:0; }

.stamp{
  width:108px; height:108px; border:6px double var(--primary);
  border-radius:50%; transform:rotate(-7deg); flex-shrink:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:var(--font-mono); color:var(--primary); text-align:center;
}
.stamp .stamp-num{ font-size:26px; font-weight:700; line-height:1; }
.stamp .stamp-label{ font-size:9px; letter-spacing:0.12em; text-transform:uppercase; margin-top:4px; }

/* ---------- Stat cards ---------- */
.stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:28px; }
.stat-card {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--primary-600);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  box-shadow: var(--shadow-card);
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative; overflow: hidden;
  transition: all 0.2s ease;
}
.stat-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.stat-card.clickable { cursor: pointer; }
.stat-card .stat-label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:8px; font-weight:600; }
.stat-card .stat-value{ font-family:var(--font-display); font-size:24px; font-weight:700; }
.stat-card .stat-meta{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

/* ---------- Dashboard panels ---------- */
.dash-grid{ display:grid; grid-template-columns:1.1fr 1fr; gap:18px; }
.panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
.panel h3{ margin:0 0 16px; font-family:var(--font-display); font-size:16px; }

.donut-row{ display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
.donut{ width:140px; height:140px; border-radius:50%; flex-shrink:0; position:relative; box-shadow: inset 0 4px 8px rgba(255,255,255,0.4), 0 8px 16px rgba(0,0,0,0.1); }
.donut-center{ position:absolute; inset:24px; background:var(--surface); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.donut-center .num{ font-family:var(--font-display); font-size:22px; font-weight:700; }
.donut-center .lbl{ font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em; }
.legend{ display:flex; flex-direction:column; gap:10px; flex:1; min-width:160px; }
.legend-item{ display:flex; align-items:center; gap:10px; font-size:13px; }
.legend-item .category-dot{ width:10px; height:10px; }
.legend-item .legend-name{ flex:1; }
.legend-item .legend-count{ font-family:var(--font-mono); color:var(--ink-soft); }

.attention-list{ display:flex; flex-direction:column; gap:8px; }
.attention-item{ display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); }
.attention-item .category-dot{ width:8px; height:8px; flex-shrink:0; }
.attention-item .att-name{ font-weight:600; }
.attention-item .att-reason{ font-size:12px; color:var(--ink-soft); }
.attention-item > div{ flex:1; min-width:0; }
.empty-note{ color:var(--ink-soft); font-size:13px; padding:8px 0; }

/* ---------- Filters ---------- */
.filter-bar{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
.pill{ padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:13px; cursor:pointer; font-weight:500; color:var(--ink-soft); font-family:var(--font-body); }
.pill.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
.select-sm{ padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); font-size:13px; color:var(--ink); font-family:var(--font-body); }

/* ---------- Table ---------- */
.table-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:13px; min-width:820px; }
thead th{
  text-align:left; padding:12px 14px; background:var(--surface-2); font-size:11px;
  text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:600;
  cursor:pointer; user-select:none; white-space:nowrap;
}
thead th .arrow{ opacity:0.5; margin-left:4px; }
tbody td{ padding:12px 14px; border-top:1px solid var(--border); vertical-align:middle; }
tbody tr{ border-left:4px solid transparent; }
tbody tr td:first-child{ font-weight:600; }
.row-name-sub{ display:block; font-size:12px; color:var(--ink-soft); font-weight:400; margin-top:2px; }
.qty-cell{ font-family:var(--font-mono); white-space:nowrap; }
.row-actions{ display:flex; gap:6px; }
.icon-btn{ border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); padding:6px 10px; cursor:pointer; font-size:12px; font-family:var(--font-body); font-weight:600; color:var(--ink); white-space:nowrap; }
.icon-btn:hover{ background:var(--surface-2); }
.icon-btn.danger:hover{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }

.badge{ display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap; }
.asset-tag{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.04em; background:var(--surface-2); border:1px dashed var(--border); border-radius:4px; padding:2px 7px; display:inline-block; }

  /* ---------- Glass Modal ---------- */
  .glass-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex; justify-content: center; align-items: center;
  z-index: 9999; padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
.glass-overlay:not([hidden]) { opacity: 1; pointer-events: auto; }
.glass-modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow-lg);
  width: 100%; max-width: 500px; max-height: 85vh;
  overflow-y: auto; padding: 24px;
  transform: scale(0.95) translateY(10px);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
}
.glass-overlay:not([hidden]) .glass-modal { transform: scale(1) translateY(0); }
  .clickable-card {
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .clickable-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(0,0,0,0.1);
  }
  .clickable-row {
    cursor: pointer;
    transition: background 0.2s;
  }
  .clickable-row:hover {
    background: var(--surface-2) !important;
  }

  /* ---------- Modal ---------- */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; z-index: 500;
}
.modal-overlay[hidden] { display: none; }

  /* ---------- Toast notification ---------- */
  .toast-notification {
  position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
  background: var(--surface); color: var(--ink);
  padding: 12px 20px; border-radius: var(--radius-md);
  box-shadow: var(--shadow-hover); border: 1px solid var(--border);
  font-size: 13px; font-weight: 600; z-index: 10000;
  opacity: 0; pointer-events: none;
  transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  display: flex; gap: 10px; align-items: center; min-width: 250px; max-width: 90vw;
}
.toast-notification.show { top: 20px; opacity: 1; pointer-events: auto; }
  .modal-overlay, .modal, .sidebar-wrapper, .bottom-nav-bar, .sheet-overlay, .overlay-sheet {
    transform: translate3d(0,0,0);
    backface-visibility: hidden;
    perspective: 1000px;
    will-change: transform, opacity;
  }
  .toast-notification {
    backface-visibility: hidden;
    perspective: 1000px;
    will-change: transform, opacity;
  }
.modal {
  background: var(--surface);
  border-radius: 20px;

function setupBackButtonHandler() {
  try {
    if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.App) {
      const { App } = Capacitor.Plugins;
      let lastBackPress = 0;

      App.addListener('backButton', (data) => {
        const convoOverlay = document.getElementById('convoOverlay');
        if (convoOverlay && convoOverlay.classList.contains('open')) {
          if (typeof window.closeConversation === 'function') {
            window.closeConversation();
          } else {
            convoOverlay.classList.remove('open');
            document.body.classList.remove('convo-open');
          }
          return;
        }

        const nmOverlay = document.getElementById('nmOverlay');
        if (nmOverlay && nmOverlay.classList.contains('show')) {
          if (typeof window.closeNewMessageSheet === 'function') {
            window.closeNewMessageSheet();
          } else {
            nmOverlay.classList.remove('show');
          }
          return;
        }

        const drilldownModal = document.getElementById('dashboardDrilldownModal');
        if (drilldownModal && !drilldownModal.hidden) {
          drilldownModal.hidden = true;
          return;
        }

        const itemDetailsModal = document.getElementById('itemDetailsModal');
        if (itemDetailsModal && !itemDetailsModal.hidden) {
          itemDetailsModal.hidden = true;
          return;
        }

        const modalOverlay = document.getElementById('modalOverlay');
        if (modalOverlay && !modalOverlay.hidden) {
          modalOverlay.hidden = true;
          return;
        }

        if (appSettings && appSettings.isAuthenticated && currentView !== 'dashboard') {
          const dashBtn = document.querySelector('[data-view="dashboard"]');
          if (dashBtn) {
            dashBtn.click();
          } else {
            currentView = 'dashboard';
            if (typeof renderView === 'function') renderView();
          }
          return;
        }

        const now = Date.now();
        if (now - lastBackPress < 2000) {
          App.exitApp();
        } else {
          lastBackPress = now;
          if (typeof window.showToast === 'function') {
            window.showToast("System", "Press back again to exit");
          } else {
            alert("Press back again to exit");
          }
        }
      });
    }
  } catch (e) {
    console.error("Error setting up back button handler:", e);
  }
}
setupBackButtonHandler();

}

function saveFCMTokenToDatabase(tokenValue) {
  console.log("Push token registered:", tokenValue);
}

function setupPushNotifications() {
  try {
    if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.PushNotifications) {
      const { PushNotifications } = Capacitor.Plugins;

      if (Capacitor.getPlatform() === 'android') {
        PushNotifications.createChannel({
          id: 'default',
          name: 'Default Channel',
          description: 'Default notification channel',
          importance: 3,
          visibility: 1,
          sound: 'beep.wav'
        }).then(() => {
          console.log("Default push notification channel created/updated.");
        }).catch(err => {
          console.error("Failed to create notification channel:", err);
        });
      }

      PushNotifications.requestPermissions().then((result) => {
        if (result.receive === 'granted') {
          PushNotifications.register();
        } else {
          console.warn("Push notification permission denied.");
        }
      });

      PushNotifications.addListener('registration', (token) => {
        console.log("Push registration success, token: " + token.value);
        window.fcmTokenValue = token.value;
        saveFCMTokenToDatabase(token.value);
      });

      PushNotifications.addListener('registrationError', (error) => {
        console.error("Push registration error: " + error.error);
      });

      PushNotifications.addListener('pushNotificationReceived', (notification) => {
        console.log("Push received: ", notification);
        if (typeof showToast === 'function') {
          showToast(notification.title || "Notification", notification.body || "");
        } else {
          alert((notification.title || "Notification") + "\n" + (notification.body || ""));
        }
        if (typeof startInventoryListener === 'function') startInventoryListener();
        if (typeof startChatListener === 'function') startChatListener();
        if (typeof startApprovalsListener === 'function') startApprovalsListener();
      });

      PushNotifications.addListener('pushNotificationActionPerformed', (action) => {
        console.log("Push action performed: ", action);
        const data = action.notification.data;
        if (data && data.targetView) {
          if (typeof setView === 'function') {
            setView(data.targetView);
            if (data.targetView === 'chat' && data.chatRecipient) {
              setTimeout(() => {
                if (typeof openConversation === 'function') {
                  openConversation(data.chatRecipient);
                }
              }, 300);
            }
          }
        }
      });
    }
  } catch (e) {
    console.error("Error setting up push notifications:", e);
  }
}

}

  let key = text;

    if (text.endsWith('Broken')) key = 'Broken';

    else if (text.endsWith('Low Stock')) key = 'Low Stock';

   VIEW LOGIC
===================================================== */
async function loadItems(){
  try{
    const result = localStorage.getItem(STORAGE_KEY);
    if (result){
      items = JSON.parse(result);
    } else {
      items = seedData();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }
    storageMode = 'persistent';
  } catch(e){
    items = seedData();
    storageMode = 'memory';
  }
}

let inventoryUnsubscribe = null;
async function fetchInventory() {
  if (!databases || !appSettings.schoolName) return;
  try {
    const snap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, [Query.equal('schoolName', appSettings.schoolName)]);
    if (snap.documents.length > 0) {
      const data = snap.documents[0];
      appSettings.schoolDocId = data.$id;
      let cloudItems = [];
      try {
        cloudItems = typeof data.items === 'string' ? JSON.parse(data.items) : (data.items || []);
      } catch(e) { cloudItems = []; }
      if (cloudItems && cloudItems.length > 0) {
        items = cloudItems;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        if (currentView === 'dashboard' || currentView === 'inventory' || currentView === 'approvals') {
          render();
        }
      }
    }
  } catch(e) {
    console.error("Inventory fetch error:", e);
  }
}

function startInventoryListener() {
  if (!appSettings.schoolName) return;
  fetchInventory();
  if (client) {
    if (inventoryUnsubscribe) { inventoryUnsubscribe(); inventoryUnsubscribe = null; }
    inventoryUnsubscribe = client.subscribe(`databases.${appwriteCfg.DATABASE_ID}.collections.${appwriteCfg.COLLECTIONS.SCHOOLS}.documents`, response => {
      if (response.payload && (response.payload.schoolName === appSettings.schoolName || response.payload.email === appSettings.email)) {
        let cloudItems = [];
        try {
          cloudItems = typeof response.payload.items === 'string' ? JSON.parse(response.payload.items) : (response.payload.items || []);
        } catch(e) { cloudItems = []; }
        if (cloudItems) {
          items = cloudItems;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
          if (currentView === 'dashboard' || currentView === 'inventory' || currentView === 'approvals') {
            render();
          }
        }
      }
    });
  }
}

async function saveItems(){
  if (storageMode !== 'persistent') { renderStorageNotice(); return; }
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    
    // Auto-Sync to Appwrite in the background if authenticated
    if (databases && appSettings.isAuthenticated && appSettings.schoolName) {
      const docId = appSettings.schoolDocId;
      if (docId) {
        databases.updateDocument(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, docId, {
          items: JSON.stringify(items),
          lastSync: new Date().toISOString()
        }).catch(err => console.error("Auto-sync failed:", err));
      } else {
        const snap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, [Query.equal('schoolName', appSettings.schoolName)]);
        if (snap.documents.length > 0) {
          appSettings.schoolDocId = snap.documents[0].$id;
          databases.updateDocument(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, snap.documents[0].$id, {
            items: JSON.stringify(items),
            lastSync: new Date().toISOString()
          }).catch(err => console.error("Auto-sync failed:", err));
        }
      }
    }
  } catch(e){
    storageMode = 'memory';
    renderStorageNotice();
  }
}

===================================================== */
function render(){
  renderSidebar();
  renderView();
  if (typeof updateChatBadge === 'function') {
    updateChatBadge();
  }
}

function renderSidebar(){
  const nav = document.getElementById('categoryNav');
  let html = `<button class="category-nav-item ${currentView==='inventory' && filters.category==='all' ? 'active':''}" data-action="filter-category" data-cat="all">
      <span class="category-dot" style="background:var(--ink-soft)"></span>
      <span>All categories</span>
      <span class="count">${items.length}</span>
    </button>`;
  for (const [key, cat] of Object.entries(CATEGORIES)){
    const count = items.filter(i=>i.category===key).length;
    const active = currentView==='inventory' && filters.category===key;
    html += `<button class="category-nav-item ${active?'active':''}" data-action="filter-category" data-cat="${key}">
      <span class="category-dot" style="background:${cat.color}"></span>
      <span>${cat.short}</span>
      <span class="count">${count}</span>
    </button>`;
  }
  nav.innerHTML = html;

  document.querySelectorAll('.nav-item, .bottom-nav-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.view === currentView);
  });

  renderStorageNotice();
}

function renderStorageNotice(){
  const el = document.getElementById('storageNotice');
  if (storageMode === 'memory'){
    el.hidden = false;
    el.innerHTML = "<strong>Warning:</strong> Private browsing or restricted storage detected. Changes will not be saved across sessions. Use <em>Export backup</em> to keep your data.";
  } else {
    el.hidden = true;
  }
}

function renderView(){
  window.scrollTo(0, 0);
  const root = document.getElementById('view');
  root.classList.remove('page-fade-in');
  void root.offsetWidth; // trigger reflow to restart animation
  root.classList.add('page-fade-in');
  
  // Hide navbar topbar on login/register
  const topbar = document.querySelector('.topbar');
  const bottomNav = document.querySelector('.bottom-nav');
  const fab = document.querySelector('.fab');
  const isAuthView = (currentView === 'login');
  const isChatView = (currentView === 'chat');
  const isApprovalsView = (currentView === 'approvals');
  const isSettingsView = (currentView === 'settings');
  if (topbar) topbar.style.display = (isAuthView || isChatView || isApprovalsView || isSettingsView) ? 'none' : 'flex';
  if (bottomNav) bottomNav.style.display = isAuthView ? 'none' : 'flex';
  if (fab) fab.style.display = (isAuthView || isChatView || isApprovalsView || isSettingsView) ? 'none' : 'flex';

  if (currentView === 'dashboard') {
    root.innerHTML = dashboardHTML();
  } else if (currentView === 'settings') {
    root.innerHTML = settingsHTML();
  } else if (currentView === 'login') {
    root.innerHTML = loginHTML();
  } else if (currentView === 'chat') {
    root.innerHTML = chatListViewHTML();
  } else if (currentView === 'approvals') {
    root.innerHTML = approvalsHTML();
  } else if (currentView === 'schoolPicker') {
    root.innerHTML = schoolPickerHTML(window.availableSchools || []);
  } else {
    root.innerHTML = inventoryHTML();
  }
}

    window.handleSettingsPhotoUpload = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 150;
          const MAX_HEIGHT = 150;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

          db.collection('schools').doc(appSettings.schoolName).update({
            photoUrl: dataUrl
          }).then(() => {
            appSettings.photoUrl = dataUrl;
            localStorage.setItem('stem_settings', JSON.stringify(appSettings));
            alert("Profile photo updated successfully!");
            renderView();
          }).catch(err => {
            console.error("Error updating photoUrl: ", err);
            alert("Error updating profile photo: " + err.message);
          });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

  async function syncToCloud() {
    if (!appSettings.schoolName || !appSettings.isAuthenticated) {
      alert("You must be logged in to sync.");
      return;
    }
    const btn = document.getElementById('syncToCloudBtn');
    if (btn) btn.textContent = 'Syncing...';
    try {
      if (!databases) throw new Error("Appwrite is not initialized");
      const snap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, [Query.equal('schoolName', appSettings.schoolName)]);
      if (snap.documents.length > 0) {
        await databases.updateDocument(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, snap.documents[0].$id, {
          items: JSON.stringify(items),
          lastSync: new Date().toISOString()
        });
      } else {
        await databases.createDocument(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, ID.unique(), {
          schoolName: appSettings.schoolName,
          email: appSettings.email,
          items: JSON.stringify(items),
          lastSync: new Date().toISOString()
        });
      }
      alert("Successfully synced to Appwrite Cloud!");
    } catch(e) {
      console.error(e);
      alert("Sync failed: " + e.message);
    }
    if (btn) btn.textContent = 'Sync to Cloud';
  }

  async function syncFromCloud() {
    if (!appSettings.schoolName || !appSettings.isAuthenticated) {
      alert("You must be logged in to sync.");
      return;
    }
    const btn = document.getElementById('syncFromCloudBtn');
    if (btn) btn.textContent = 'Downloading...';
    try {
      if (!databases) throw new Error("Appwrite is not initialized");
      const snap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, [Query.equal('schoolName', appSettings.schoolName)]);
      if (snap.documents.length > 0) {
        const data = snap.documents[0];
        let cloudItems = [];
        try {
          cloudItems = typeof data.items === 'string' ? JSON.parse(data.items) : (data.items || []);
        } catch(e) { cloudItems = []; }
        if (cloudItems && cloudItems.length > 0) {
          items = cloudItems;
          saveItems();
          render();
          alert("Successfully downloaded from Appwrite Cloud!");
        } else {
          alert("No inventory data found in the cloud for this school.");
        }
      } else {
        alert("No cloud profile found for this school. Try syncing to cloud first.");
      }
    } catch(e) {
      console.error(e);
      alert("Download failed: " + e.message);
    }
    if (btn) btn.textContent = 'Download from Cloud';
  }

/* ---------- Inventory ---------- */
function inventoryHTML(){
  let list = items.filter(i=>{
    if (filters.category!=='all' && i.category!==filters.category) return false;
    
    // New status filter logic using numerical fields
    if (filters.status !== 'all') {
      if (filters.status === 'Broken' && (i.brokenQty || 0) === 0) return false;
      if (filters.status === 'Lost' && (i.lostQty || 0) === 0) return false;
      if (filters.status === 'LowStock' && (i.lowStockQty || 0) === 0) return false;
      if (filters.status === 'Available' && (i.quantity - (i.brokenQty||0) - (i.lostQty||0) - (i.lowStockQty||0)) <= 0) return false;
      if (filters.status === 'Maintenance' && i.status !== 'Maintenance') return false; // Legacy fallback if needed
    }

    if (filters.search){
      const s = filters.search.toLowerCase();
      const haystack = [i.name,i.assetTag,i.serialNumber,i.location,i.supplier].join(' ').toLowerCase();
      if (!haystack.includes(s)) return false;
    }
    return true;
  });

  list = sortItems(list);

  return `
    <div class="page-header">
      <div>
        <h1 class="page-title">Inventory</h1>
        <p class="page-subtitle">${list.length} of ${items.length} item${items.length===1?'':'s'} shown</p>
      </div>
    </div>

    <div class="filter-bar">
      <button class="pill ${filters.category==='all'?'active':''}" data-action="filter-category" data-cat="all">All</button>
      ${Object.entries(CATEGORIES).map(([k,c])=>`<button class="pill ${filters.category===k?'active':''}" data-action="filter-category" data-cat="${k}">${c.short}</button>`).join('')}
      <select class="select-sm" id="statusFilter">
        <option value="all">All statuses</option>
        <option value="Available" ${filters.status==='Available'?'selected':''}>Available</option>
        <option value="Broken" ${filters.status==='Broken'?'selected':''}>Broken</option>
        <option value="Lost" ${filters.status==='Lost'?'selected':''}>Lost</option>
        <option value="LowStock" ${filters.status==='LowStock'?'selected':''}>Low Stock</option>
      </select>
    </div>

    <div class="table-wrap" style="background:transparent; border:none; box-shadow:none; overflow:visible;">
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${list.length===0
          ? `<div class="empty-note" style="padding:20px; text-align:center; background:var(--surface); border-radius:var(--radius); border:1px solid var(--border);">No items match these filters.</div>`
          : list.map(i=>{
              const avail = i.quantity - (i.brokenQty||0) - (i.lostQty||0) - (i.lowStockQty||0);
              let statusBadges = '';
              if (avail > 0) statusBadges += badge(avail + ' Avail', STATUS_COLORS) + ' ';
              if ((i.brokenQty||0) > 0) statusBadges += badge(i.brokenQty + ' Broken', STATUS_COLORS) + ' ';
              if ((i.lostQty||0) > 0) statusBadges += badge(i.lostQty + ' Lost', STATUS_COLORS) + ' ';
              if ((i.lowStockQty||0) > 0) statusBadges += badge(i.lowStockQty + ' Low Stock', STATUS_COLORS) + ' ';
              if (!statusBadges) statusBadges = badge('0 Avail', STATUS_COLORS);

              return `
            <div class="compact-list-item" data-action="view-item" data-id="${i.id}" style="border-left-color:${CATEGORIES[i.category].color}">
              <div class="row-top">
                <span class="item-name">${escapeHtml(i.name)}</span>
                <span class="item-qty">${i.quantity} ${escapeHtml(i.unit||'')} Total</span>
                <span class="item-status">${statusBadges}</span>
              </div>
              <div class="row-bottom">
                <span class="item-cat">${CATEGORIES[i.category].label}</span>
                <span class="item-tag">${escapeHtml(i.assetTag||'--')}</span>
                <span class="item-cost">${fmtMoney(i.cost)}/unit</span>
              </div>
            </div>
          `}).join('')}
      </div>
    </div>
  `;
}

function sortItems(list){
  const {col, dir} = sortState;
  const mult = dir==='asc' ? 1 : -1;
  return [...list].sort((a,b)=>{
    if (col==='quantity') return (Number(a.quantity)-Number(b.quantity))*mult;
    if (col==='cost') return (Number(a.cost)-Number(b.cost))*mult;
    let av, bv;
    if (col==='category'){ av=CATEGORIES[a.category].label; bv=CATEGORIES[b.category].label; }
    else if (col==='assetTag'){ 
        return a.assetTag.localeCompare(b.assetTag, undefined, {numeric: true}) * mult;
    }
    else { av=a[col]; bv=b[col]; }
    av = String(av??'').toLowerCase();
    bv = String(bv??'').toLowerCase();
    if (av<bv) return -1*mult;
    if (av>bv) return 1*mult;
    return 0;
  });
}

async function saveItemFromForm(id){
  const now = new Date().toISOString();
  const quantity = Number(document.getElementById('quantityInput').value) || 0;
  const brokenQty = Number(document.getElementById('brokenQtyInput').value) || 0;
  const lostQty = Number(document.getElementById('lostQtyInput').value) || 0;
  const lowStockQty = Number(document.getElementById('lowStockQtyInput').value) || 0;

  if (brokenQty + lostQty + lowStockQty > quantity) {
    alert("Error: The sum of Broken, Lost, and Low Stock quantities (" + (brokenQty + lostQty + lowStockQty) + ") cannot exceed the Total Quantity (" + quantity + ").");
    return;
  }

  const data = {
    name: document.getElementById('nameInput').value.trim(),
    category: document.getElementById('categorySelect').value,
    subcategory: document.getElementById('subcategoryInput').value.trim(),
    quantity: quantity,
    brokenQty: brokenQty,
    lostQty: lostQty,
    lowStockQty: lowStockQty,
    unit: document.getElementById('unitInput').value.trim() || 'Each',
    location: document.getElementById('locationInput').value.trim(),
    assetTag: document.getElementById('assetTagInput').value.trim(),
    serialNumber: document.getElementById('serialInput').value.trim(),
    minStock: Number(document.getElementById('minStockInput').value) || 0,
    cost: Number(document.getElementById('costInput').value) || 0,
    purchaseDate: document.getElementById('purchaseDateInput').value,
    warrantyExpiry: document.getElementById('warrantyInput').value,
    supplier: document.getElementById('supplierInput').value.trim(),
    notes: document.getElementById('notesInput').value.trim(),
    lastUpdated: now
  };

  if (!data.name){
    alert('Please enter an item name.');
    return;
  }

  if (id){
    const idx = items.findIndex(i=>i.id===id);
    // Keep the existing isLowStock flag when editing
    data.isLowStock = items[idx].isLowStock;
    items[idx] = Object.assign({}, items[idx], data);
  } else {
    items.push(Object.assign({id:uid(), dateAdded:now, isLowStock:false}, data));
  }

  await saveItems();
  closeModal();
  render();
}

function deleteItem(id){
  const item = items.find(i=>i.id===id);
  if (!item) return;
  if (!confirm(`Delete "${item.name}" from inventory? This can't be undone.`)) return;
  items = items.filter(i=>i.id!==id);
  saveItems();
  render();
}

===================================================== */
function csvEscape(val){
  const s = String(val ?? '');
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportCSV(){
  const headers = ['Name','Category','Subcategory','Quantity','Unit','Status','Location','Asset Tag','Serial Number','Min Stock','Low Stock Flag','Unit Cost (GH&#8373;)','Total Value (GH&#8373;)','Supplier','Purchase Date','Warranty Expiry','Notes','Date Added','Last Updated'];
  const rows = items.map(i=>[
    i.name, CATEGORIES[i.category].label, i.subcategory, i.quantity, i.unit, i.status,
    i.location, i.assetTag, i.serialNumber, i.minStock, i.isLowStock ? 'Yes' : 'No', i.cost,
    (Number(i.quantity||0)*Number(i.cost||0)).toFixed(2),
    i.supplier, i.purchaseDate, i.warrantyExpiry, i.notes, i.dateAdded, i.lastUpdated
  ]);
  const csv = [headers, ...rows].map(row=>row.map(csvEscape).join(',')).join('\n');
  downloadFile(csv, 'equipment-inventory.csv', 'text/csv');
}
function exportJSON(){
  downloadFile(JSON.stringify(items, null, 2), 'equipment-inventory-backup.json', 'application/json');
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('Invalid format');
      if (!confirm(`Import ${data.length} item(s)? This will replace your current inventory.`)) return;
      items = data.map(d=>Object.assign(mkItem({}), d));
      await saveItems();
      render();
    } catch(err){
      alert("Couldn't import this file. Make sure it's a backup exported from Equipment Ledger.");
    }
  };
  reader.readAsText(file);
}

function viewDrilldown(type, categoryKey) {
  const modal = document.getElementById('dashboardDrilldownModal');
  const title = document.getElementById('drilldownTitle');
  const body = document.getElementById('drilldownBody');
  
  // Also close other modals to avoid stacking issues (added earlier)
  document.getElementById('itemDetailsModal').hidden = true;
  document.getElementById('modalOverlay').hidden = true;

  let filtered = [];
  if (type === 'all') {
    title.textContent = 'All Items';
    filtered = items;
  } else if (type === 'lowstock') {
    title.textContent = 'Low Stock Items';
    filtered = items.filter(i => (Number(i.quantity||0) - Number(i.brokenQty||0) - Number(i.lostQty||0) - Number(i.lowStockQty||0) - Number(i.borrowedQty||0) <= Number(i.minStock||0)) || i.isLowStock || Number(i.lowStockQty||0) > 0);
  } else if (type === 'available') {
    title.textContent = 'Available Items';
    filtered = items.filter(i => (Number(i.quantity||0) - Number(i.brokenQty||0) - Number(i.lostQty||0) - Number(i.lowStockQty||0)) > 0);
  } else if (type === 'broken') {
    title.textContent = 'Broken Items';
    filtered = items.filter(i => Number(i.brokenQty||0) > 0);
  } else if (type === 'lost') {
    title.textContent = 'Lost Items';
    filtered = items.filter(i => Number(i.lostQty||0) > 0);
  } else if (type === 'category') {
    title.textContent = CATEGORIES[categoryKey].label;
    filtered = items.filter(i => i.category === categoryKey);
  }

  if (filtered.length === 0) {
    body.innerHTML = '<div style="color:var(--ink-soft); font-size:14px; text-align:center; padding:20px;">No items found.</div>';
  } else {
    body.innerHTML = filtered.map(i => `
      <div class="clickable-row" data-action="view-item" data-id="${i.id}" style="padding:10px; border-bottom:1px solid rgba(0,0,0,0.05); display:flex; justify-content:space-between; align-items:center;">

        </div>
        <span style="font-size:18px; color:var(--ink-soft);">&rsaquo;</span>
      </div>
    `).join('');
  }
  modal.hidden = false;
}

function setupGlobalListeners(){
  document.body.addEventListener('submit', async e => {
      if (e.target.id === 'loginForm') {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim().toLowerCase();
        const pwd = document.getElementById('loginPassword').value;
        const errDiv = document.getElementById('loginError');
        if (errDiv) errDiv.style.display = 'none';
        
        try {
          if (!databases) throw new Error("Appwrite is not connected");
          
          // Check if account is revoked
          const revokeSnap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.REVOKED, [Query.equal('email', email)]);
          if (revokeSnap.documents.length > 0) {
            alert("Access Denied: This school account has been removed by the Science Coordinator.");
            return;
          }

          const schoolSnap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, [Query.equal('email', email)]);
          if (schoolSnap.documents.length === 0) {
            throw new Error("Invalid school email address or account not found.");
          }

          const schoolDoc = schoolSnap.documents[0];
          const expectedPassword = schoolDoc.currentPassword || 'password123';
          if (pwd !== expectedPassword) {
            throw new Error("Incorrect master password for " + (schoolDoc.schoolName || email));
          }

          if (schoolDoc.type === 'community') {
            alert("Access Denied: This app is for STEM schools only. Please use the Community App.");
            return;

  function showToast(message, bodyText) {
    const toast = document.getElementById('toastNotification');
    const msgEl = document.getElementById('toastMessage');
    if (!toast || !msgEl) return;
    msgEl.innerText = bodyText || message;
    toast.classList.add('show');
    
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    } catch(e) { console.error("Audio failed", e); }

    setTimeout(() => {
      toast.classList.remove('show');
    }, 4000);
  }
  window.showToast = showToast;

  function addToRecentChats(email, name) {

  function getInitials(name) {
    if (!name) return '?';
    if (name === 'Science Coordinator') return 'SC';
    const parts = name.trim().split(' ');
    return parts.map(p => p[0]).join('').substring(0, 2).toUpperCase();

  function getAvatarColor(email) {
    const colors = ['#1C2D5E','#2D6A4F','#C9622A','#6B4FA0','#1D6E8A','#8B5E3C','#A0436B','#2E7D32'];
    let hash = 0;
    for (let i = 0; i < (email||'').length; i++) hash = ((hash << 5) - hash) + email.charCodeAt(i);
    return colors[Math.abs(hash) % colors.length];
  }

  async function fetchRegisteredSchools() {
    if (!databases) return;
    try {
      const snap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.SCHOOLS, [Query.limit(100)]);
      const arr = [];
      snap.documents.forEach(doc => {
        if (doc.email !== appSettings.email) {
          arr.push({ name: doc.schoolName || doc.$id, email: doc.email, photoUrl: doc.photoUrl });
        }

      arr.sort((a,b) => a.name.localeCompare(b.name));
      registeredSchools = arr;

    }

  function getNameForEmail(email) {
    if (email === 'master') return 'Science Coordinator';
    const school = registeredSchools.find(s => s.email === email);
    if (school) return school.name;
    const recent = recentChats.find(r => r.email === email);
    if (recent) return recent.name;
    return email;
  }

  function getPhotoUrlForEmail(email) {
    if (email === 'master') return null;
    const school = registeredSchools.find(s => s.email === email);
    return school ? school.photoUrl : null;

  function getLastMessageForRecipient(email) {
    const filtered = chatMessages.filter(m => {
      if (email === 'master') {
        return (m.senderEmail === appSettings.email && (m.recipientEmail === 'master' || m.type === 'master')) ||
               (m.senderEmail === 'master' && m.recipientEmail === appSettings.email);
      } else {
        return (m.senderEmail === appSettings.email && m.recipientEmail === email) ||
               (m.senderEmail === email && m.recipientEmail === appSettings.email);
      }
    });
    return filtered.length > 0 ? filtered[filtered.length - 1] : null;
  }

  /* ---------- chatListViewHTML ---------- */
  function chatListViewHTML() {
    // Build recent chats list sorted by last message time
    let chatItems = recentChats.map(r => {
      const lastMsg = getLastMessageForRecipient(r.email);

      let timeStr = '';
      let ts = 0;
      if (lastMsg) {
        snippet = lastMsg.text || '';
        if (snippet.length > 40) snippet = snippet.substring(0, 40) + '…';
        let d = lastMsg.timestamp;
        if (d && typeof d.toDate === 'function') d = d.toDate();
        if (d) {
          ts = new Date(d).getTime();
          timeStr = new Date(d).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        }
      }
      const badge = unreadCounts[r.email] || 0;
      return { email: r.email, name: r.name, snippet, timeStr, ts, badge };
    });
    // Sort newest first
    chatItems.sort((a,b) => (b.ts || 0) - (a.ts || 0));

    let rowsHTML = '';
    if (chatItems.length === 0) {
      rowsHTML = `

        const avatarHTML = photo ?
          `<img class="chat-avatar" src="${photo}" style="object-fit: cover; width: 40px; height: 40px; border-radius: 50%;">` :
          `<div class="chat-avatar" style="background:${getAvatarColor(c.email)}">${getInitials(c.name)}</div>`;
        return `
          <div class="recent-chat-row" onclick="openConversation('${escapeHtml(c.email)}')" ontouchstart="chatRowTouchStart(event, '${escapeHtml(c.email)}')" ontouchend="chatRowTouchEnd(event, '${escapeHtml(c.email)}')" onmousedown="chatRowMouseDown(event, '${escapeHtml(c.email)}')" onmouseup="chatRowMouseUp(event, '${escapeHtml(c.email)}')" onmouseleave="chatRowMouseLeave(event)">

            </div>
            <div class="recent-chat-meta">
              ${c.timeStr ? `<div class="recent-chat-time">${c.timeStr}</div>` : ''}
              ${c.badge > 0 ? `<div class="recent-chat-badge">${c.badge}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    return `
      <div class="page-header">
        <div>
          <h1 class="page-title">Messages</h1>

        </button>

      <div class="chat-list-view">
        <div class="chat-list-body">

  window.confirmDeleteConversation = function(email) {
    const schoolName = getNameForEmail(email) || email;
    if (confirm(`Delete Conversation?\n\nWarning: This action will permanently delete all messages in this conversation for both schools. This cannot be undone.`)) {
      db.collection('chat_messages')
        .where('senderEmail', 'in', [appSettings.email, email])
        .where('recipientEmail', 'in', [appSettings.email, email])
        .get()
        .then(snapshot => {
          const batch = db.batch();
          let count = 0;
          snapshot.forEach(doc => {
            const d = doc.data();
            // Ensure exact matching of sender/recipient pair (necessary due to 'in' query limitations)
            if ((d.senderEmail === appSettings.email && d.recipientEmail === email) ||
                (d.senderEmail === email && d.recipientEmail === appSettings.email)) {
              batch.delete(doc.ref);
              count++;
            }
          });
          if (count > 0) {
            return batch.commit();
          }
        })
        .then(() => {
          if (typeof showToast === 'function') {
            if (showToast.length === 1) {
              showToast("Conversation deleted");
            } else {
              showToast("System", "Conversation deleted");
            }
          } else {
            alert("Conversation deleted");
          }
          if (typeof renderView === 'function') renderView();
        })
        .catch(err => {
          console.error("Error deleting conversation: ", err);
          alert("Error deleting conversation: " + err.message);
        });
    } else {
      // If cancelled, reset long pressing flag immediately
      window.isLongPressing = false;
    }
  };

    currentChatRecipient = email;
    const name = getNameForEmail(email);
    addToRecentChats(email, name);

    // Clear unread for this recipient by updating its last read timestamp
    const recipientMessages = chatMessages.filter(m => {
      if (email === 'master') {
        return (m.senderEmail === appSettings.email && (m.recipientEmail === 'master' || m.type === 'master')) ||
               (m.senderEmail === 'master' && m.recipientEmail === appSettings.email);
      } else {
        return (m.senderEmail === appSettings.email && m.recipientEmail === email) ||
               (m.senderEmail === email && m.recipientEmail === appSettings.email);
      }
    });
    if (recipientMessages.length > 0) {
      const lastMsg = recipientMessages[recipientMessages.length - 1];
      let ts = lastMsg.timestamp;
      if (ts && typeof ts.toDate === 'function') ts = ts.toDate();
      if (ts) {
        lastReadTimestamps[email] = new Date(ts).getTime();

    try {
      fetchRegisteredSchools();
      const res = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.MESSAGES, [Query.limit(100), Query.orderAsc('createdAt')]);
      const newMessages = res.documents.map(d => ({
        id: d.$id,
        senderEmail: d.sender,
        recipientEmail: d.recipient,
        senderSchool: d.senderSchool || (d.sender === 'master' ? 'Science Coordinator' : d.sender),
        text: d.text,
        timestamp: d.createdAt || d.$createdAt,
        type: d.type || (d.recipient === 'broadcast' ? 'broadcast' : (d.recipient === 'master' ? 'master' : 'direct')),
        ...d
      }));

      const newUnreadCounts = {};
      newMessages.forEach(m => {
        if (m.senderEmail === appSettings.email) return;

        let senderKey = null;
        if (m.senderEmail === 'master') {
          if (m.recipientEmail === appSettings.email || m.recipientEmail === 'broadcast') {
            senderKey = 'master';
          } else {
            return;
          }
        } else {
          if (m.recipientEmail === appSettings.email) {
            senderKey = m.senderEmail;
          } else {
            return;
          }
        }

        const senderName = senderKey === 'master' ? 'Science Coordinator' : (m.senderSchool || m.senderEmail);
        if (!recentChats.some(r => r.email === senderKey)) {
          addToRecentChats(senderKey, senderName);
        }

        const msgTs = new Date(m.timestamp).getTime() || 0;
        const lastReadTs = lastReadTimestamps[senderKey] || 0;

        const isViewingThis = currentView === 'chat' && currentChatRecipient === senderKey &&
                              document.getElementById('convoOverlay')?.classList.contains('open');

        if (isViewingThis) {
          lastReadTimestamps[senderKey] = Math.max(lastReadTs, msgTs);
          saveLastReadTimestamps();
        } else if (msgTs > lastReadTs) {
          newUnreadCounts[senderKey] = (newUnreadCounts[senderKey] || 0) + 1;
        }
      });

      unreadCounts = newUnreadCounts;
      updateChatBadge();
      chatMessages = newMessages;

      if (currentChatRecipient && document.getElementById('convoOverlay')?.classList.contains('open')) {
        renderConvoMessages();
      }

      if (currentView === 'chat' && !document.getElementById('convoOverlay')?.classList.contains('open')) {
        const root = document.getElementById('view');
        if (root) root.innerHTML = chatListViewHTML();
      }
    } catch(err) {
      console.error("Chat fetch error:", err);
    }
  }

  function updateApprovalsBadge() {
    const actionCount = incomingRequests.filter(r => r.status === 'pending' || r.status === 'returning').length;
    const badges = document.querySelectorAll('.approvals-badge-counter');
    badges.forEach(badge => {
      badge.innerText = actionCount;
      badge.style.display = actionCount > 0 ? 'inline-block' : 'none';
    });
  }

  async function fetchApprovals() {
    if (!databases || !appSettings.email) return;
    try {
      const res = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.REQUESTS, [Query.limit(100)]);
      const incoming = [];
      const outgoing = [];

      res.documents.forEach(doc => {
        if (doc.archived) return;
        let items = [];
        try { items = typeof doc.items === 'string' ? JSON.parse(doc.items) : (doc.items || []); } catch(e) { items = []; }
        const req = { ...doc, id: doc.$id, items: items };

        if (req.targetSchoolEmail === appSettings.email || req.targetSchool === appSettings.schoolName) {
          incoming.push(req);
        } else if (req.requesterEmail === appSettings.email || req.requesterSchool === appSettings.schoolName) {
          outgoing.push(req);
        }
      });

      if (!approvalsInitialLoad) {
        incoming.forEach(newReq => {
          if (newReq.status === 'pending') {
            const oldReq = incomingRequests.find(o => o.id === newReq.id);
            if (!oldReq || oldReq.status !== 'pending') {
              showToast(`New borrow request from ${newReq.requesterSchool || newReq.requestingSchool}!`);
            }
          } else if (newReq.status === 'returning') {
            const oldReq = incomingRequests.find(o => o.id === newReq.id);
            if (!oldReq || oldReq.status !== 'returning') {
              showToast(`Return request initiated by ${newReq.requesterSchool || newReq.requestingSchool}!`);
            }
          }
        });
      }
      approvalsInitialLoad = false;

      incomingRequests = incoming.sort((a, b) => new Date(b.requestedAt || b.$createdAt || 0) - new Date(a.requestedAt || a.$createdAt || 0));
      outgoingRequests = outgoing.sort((a, b) => new Date(b.requestedAt || b.$createdAt || 0) - new Date(a.requestedAt || a.$createdAt || 0));

      updateApprovalsBadge();

      if (currentView === 'approvals') {
        const root = document.getElementById('view');
        if (root) root.innerHTML = approvalsHTML();
      }
    } catch(err) {
      console.error("Approvals fetch error:", err);
    }
  }

  function startApprovalsListener() {
    fetchApprovals();
    if (client) {
      if (approvalsUnsubscribe) { approvalsUnsubscribe(); approvalsUnsubscribe = null; }
      approvalsUnsubscribe = client.subscribe(`databases.${appwriteCfg.DATABASE_ID}.collections.${appwriteCfg.COLLECTIONS.REQUESTS}.documents`, () => {
        fetchApprovals();
      });
    }
  }

  function timeAgo(date) {
    if (!date) return 'some time ago';
    const seconds = Math.floor((new Date() - new Date(date)) / 1000);
    if (seconds < 0) return 'just now';
    
    let interval = Math.floor(seconds / 31536000);
    if (interval >= 1) return interval + " year" + (interval === 1 ? "" : "s") + " ago";
    interval = Math.floor(seconds / 2592000);
    if (interval >= 1) return interval + " month" + (interval === 1 ? "" : "s") + " ago";
    interval = Math.floor(seconds / 86400);
    if (interval >= 1) return interval + " day" + (interval === 1 ? "" : "s") + " ago";
    interval = Math.floor(seconds / 3600);
    if (interval >= 1) return interval + " hour" + (interval === 1 ? "" : "s") + " ago";
    interval = Math.floor(seconds / 60);
    if (interval >= 1) return interval + " minute" + (interval === 1 ? "" : "s") + " ago";
    return "just now";
  }

  window.approveBorrowRequest = async function(reqId) {
    try {
      if (!databases) return;
      await databases.updateDocument(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.REQUESTS, reqId, {
        status: 'approved',
        reviewedAt: new Date().toISOString()
      });
      const req = incomingRequests.find(r => r.id === reqId);
      if (req) {
        // Increment borrowed quantity in school's inventory
        if (req.items) {
          req.items.forEach(reqItem => {
            const invItem = items.find(i => i.id === reqItem.itemId);
            if (invItem) {
              invItem.borrowedQty = (invItem.borrowedQty || 0) + Number(reqItem.quantity || 0);
            }
          });
          await saveItems();
        }

        if (req.requesterEmail && typeof sendFCMNotification === 'function') {
          sendFCMNotification(
            req.requesterEmail,
            "Borrow Request Approved",
            `Your request for ${req.itemName || 'equipment'} was approved.`,
            "approvals"
          );
        }
      }
      closeModal();
      alert("Borrow request approved successfully!");
      if (typeof fetchApprovals === 'function') fetchApprovals();
    } catch(e) {
      console.error("Error approving request:", e);
      alert("Error approving request: " + e.message);
    }
  };

  window.disapproveBorrowRequest = async function(reqId) {
    const reason = document.getElementById('disapprovalReasonInput').value.trim();
    if (!reason) {
      alert("Please provide a reason for disapproval.");
      return;
    }

    try {
      if (!databases) return;
      await databases.updateDocument(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.REQUESTS, reqId, {
        status: 'disapproved',
        disapprovalReason: reason,
        reviewedAt: new Date().toISOString()
      });
      const req = incomingRequests.find(r => r.id === reqId);
      if (req && req.requesterEmail && typeof sendFCMNotification === 'function') {
        sendFCMNotification(
          req.requesterEmail,
          "Borrow Request Disapproved",
          `Your request for ${req.itemName || 'equipment'} was disapproved. Reason: ${reason}`,
          "approvals"
        );
      }
      closeModal();
      alert("Borrow request disapproved.");
      if (typeof fetchApprovals === 'function') fetchApprovals();
    } catch(e) {
      console.error("Error disapproving request:", e);
      alert("Error disapproving request: " + e.message);
    }
  };

  window.confirmReturnReceived = async function(reqId) {
    if (!confirm("Are you sure you want to confirm that all items for this request have been returned?")) return;
    
    try {
      if (!databases) return;
      
      const req = incomingRequests.find(r => r.id === reqId);
      if (!req) return;

      await databases.updateDocument(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.REQUESTS, reqId, {
        status: 'returned',
        returnedAt: new Date().toISOString()
      });

      // Decrement borrowed quantity in school's inventory (Automatic Restoration)
      if (req.items) {
        req.items.forEach(reqItem => {
          const invItem = items.find(i => i.id === reqItem.itemId);
          if (invItem) {
            invItem.borrowedQty = Math.max(0, (invItem.borrowedQty || 0) - Number(reqItem.quantity || 0));
          }
        });
        await saveItems();
      }

      // Send notification to the Borrower (Community App)
      if (req.requesterEmail && typeof sendFCMNotification === 'function') {
        sendFCMNotification(
          req.requesterEmail,
          "Return Confirmed",
          `${appSettings.schoolName} has confirmed that the borrowed items have been successfully returned.`,
          "approvals"
        );
      }

      closeModal();
      alert("Return confirmed successfully!");
      if (typeof fetchApprovals === 'function') fetchApprovals();
    } catch(e) {
      console.error("Error confirming return:", e);
      alert("Error confirming return: " + e.message);
    }
  };

/* =====================================================
   INIT
===================================================== */
  async function checkOverdueReturns() {
    if (!databases || !appSettings.schoolName) return;
    
    const todayStr = new Date().toISOString().split('T')[0];
    
    try {
      const snap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.REQUESTS, [
        Query.equal('targetSchool', appSettings.schoolName),
        Query.equal('status', 'approved')
      ]);
        
      snap.documents.forEach(req => {
        if (req.endDate && req.endDate < todayStr) {
          window.showToast(
            "Overdue Equipment Return",
            `${req.requesterSchool} has not returned equipment that was due on ${req.endDate}.`
          );

          if (typeof window.Capacitor !== 'undefined' && window.Capacitor.isPluginAvailable && window.Capacitor.isPluginAvailable('LocalNotifications')) {
            window.Capacitor.Plugins.LocalNotifications.schedule({
              notifications: [{
                title: "Equipment Return Overdue",
                body: `${req.requesterSchool} is overdue for returning equipment (Due: ${req.endDate}).`,
                id: Math.floor(Math.random() * 100000),
                schedule: { at: new Date(Date.now() + 1000) }
              }]
            });
          }
        }
      });
    } catch (err) {
      console.error("Error checking overdue returns:", err);
    }
  }

  async function startRevocationListener(email) {
    if (!client || !email) return;
    if (window.revokeListener) { window.revokeListener(); window.revokeListener = null; }
    window.revokeListener = client.subscribe(`databases.${appwriteCfg.DATABASE_ID}.collections.${appwriteCfg.COLLECTIONS.REVOKED}.documents`, response => {
      if (response.payload && response.payload.email === email) {
        alert("Access Denied: This school account has been removed by the Science Coordinator.");
        appSettings.isAuthenticated = false;
        localStorage.removeItem('stem_settings');
        currentView = 'login';
        render();
      }
    });
  }

async function init(){
  try {
    if (appSettings.isAuthenticated && appSettings.email) {
      if (databases) {
        try {
          const revSnap = await databases.listDocuments(appwriteCfg.DATABASE_ID, appwriteCfg.COLLECTIONS.REVOKED, [Query.equal('email', appSettings.email)]);
          if (revSnap.documents.length > 0) {
            alert("Access Denied: This school account has been removed by the Science Coordinator.");
            appSettings.isAuthenticated = false;
            localStorage.removeItem('stem_settings');
            currentView = 'login';
            render();
            dismissSplash();
            return;
          }
        } catch(e) {
          console.error("Revocation check error:", e);
        }
      }

      startRevocationListener(appSettings.email);
      startInventoryListener();
      startChatListener();
      startApprovalsListener();
      checkOverdueReturns();
      if (currentView === 'login') {
        currentView = 'dashboard';
      }
    } else {
      currentView = 'login';
    }

    await loadItems();
    setupGlobalListeners();
    setupPushNotifications();
    if (appSettings.isAuthenticated) {
      if (window.fcmTokenValue) {
        saveFCMTokenToDatabase(window.fcmTokenValue);
      }
      startInventoryListener();
      startChatListener();
      startApprovalsListener();
    }

    render();
    dismissSplash();
  } catch(e) {
    console.error("Initialization error:", e);
    render();
    dismissSplash();
  }
}

function dismissSplash() {
  let pct = 0;
  const pctEl = document.getElementById('splashPercent');
  const iv = setInterval(() => {
    pct += 5;
    if (pctEl) pctEl.style.width = Math.min(pct, 100) + '%';
    if (pct >= 100) {
      clearInterval(iv);
      const splash = document.getElementById('splashScreen');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }
    }
  }, 40);
}

  // Swipe to change tabs
  (function() {
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    const views = ['dashboard', 'inventory', 'chat', 'approvals', 'settings'];

    document.addEventListener('touchstart', e => {
      if (currentView === 'login') return;
      
      const itemModal = document.getElementById('itemModal');
      const detailModal = document.getElementById('detailModal');
      if (itemModal && itemModal.style.display === 'flex') return;
      if (detailModal && detailModal.style.display === 'flex') return;
      if (document.getElementById('convoOverlay') && document.getElementById('convoOverlay').classList.contains('open')) return;
      if (document.getElementById('nmOverlay') && document.getElementById('nmOverlay').classList.contains('show')) return;
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      if (currentView === 'login') return;
      const itemModal = document.getElementById('itemModal');
      const detailModal = document.getElementById('detailModal');
      if (itemModal && itemModal.style.display === 'flex') return;
      if (detailModal && detailModal.style.display === 'flex') return;
      if (document.getElementById('convoOverlay') && document.getElementById('convoOverlay').classList.contains('open')) return;
      if (document.getElementById('nmOverlay') && document.getElementById('nmOverlay').classList.contains('show')) return;
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;

      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.abs(diffX) > 60 && Math.abs(diffY) < 40) {
        const currentIndex = views.indexOf(currentView);
        if (currentIndex === -1) return;

        if (diffX < 0) {
          if (currentIndex < views.length - 1) {
            currentView = views[currentIndex + 1];
            render();
          }
        } else {
          if (currentIndex > 0) {
            currentView = views[currentIndex - 1];
            render();
          }
        }
      }
    }
  })();

  init();

})();
</script>
